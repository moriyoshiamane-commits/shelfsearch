<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アフター対応検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
  max-width: none;
}

h2 {
  margin-bottom: 12px;
}

.search-box {
  margin-bottom: 10px;
  max-width: 420px;
}

label {
  display: block;
  margin-bottom: 3px;
}

input {
  width: 400px;
  max-width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 15px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}

</style>
</head>

<body>

<h2>アフター対応検索</h2>

<div class="search-box">
<label>客先名（部分一致）</label>
<input id="name">
</div>

<div class="search-box">
<label>電話番号（部分一致）</label>
<input id="tel">
</div>

<div class="search-box">
<label>機種名称（部分一致）</label>
<input id="model">
</div>

<div class="search-box">
<label>機械№（部分一致）</label>
<input id="machine">
</div>

<div class="search-box">
<label>BOX名（部分一致）</label>
<input id="box">
</div>

<button onclick="search()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

/* ✅ 月次バージョン（ここだけ毎月変更） */
const version = "2026-05";

/* ✅ CSV読み込み（キャッシュ対策済） */
fetch('OTHER.csv?v=' + version)
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => line.split(','));

  console.log("読み込み件数:", data.length);

});

/* ✅ 検索処理 */
function search() {

  const name = document.getElementById('name').value;
  const tel = document.getElementById('tel').value;
  const model = document.getElementById('model').value.toLowerCase();
  const machine = document.getElementById('machine').value.toLowerCase();
  const box = document.getElementById('box').value.toLowerCase();

  const result = document.getElementById('result');
  result.innerHTML = '';

  data.filter(d => {

    return (!name || (d[0] || '').includes(name)) &&
           (!tel || (d[1] || '').includes(tel)) &&
           (!model || (d[2] || '').toLowerCase().includes(model)) &&
           (!machine || (d[3] || '').toLowerCase().includes(machine)) &&
           (!box || (d[4] || '').toLowerCase().includes(box));

  }).forEach(d => {

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div><strong>${d[0] || ''}</strong></div>
      <div>電話：${d[1] || ''}</div>
      <div>機種：${d[2] || ''}</div>
      <div>機械№：${d[3] || ''}</div>
      <div>BOX：${d[4] || ''}</div>
    `;

    result.appendChild(card);

  });

}

</script>

</body>
</html>
