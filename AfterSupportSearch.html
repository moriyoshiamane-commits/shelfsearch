<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アフター対応検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
}

h2 {
  margin-bottom: 12px;
}

.search-box {
  margin-bottom: 10px;
  max-width: 420px;
}

label {
  display: block;
  margin-bottom: 3px;
}

input {
  width: 400px;
  max-width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 15px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}
</style>

</head>

<body>

<h2>アフター対応検索</h2>

<div class="search-box">
<label>客先名（部分一致）</label>
<input id="name" placeholder="例：スター精機 大阪">
</div>

<div class="search-box">
<label>電話番号（部分一致）</label>
<input id="tel" placeholder="例：077123">
</div>

<div class="search-box">
<label>機種名称（部分一致）</label>
<input id="model" placeholder="例：GX-1100">
</div>

<div class="search-box">
<label>機械№（部分一致）</label>
<input id="machine" placeholder="例：GX11N-">
</div>

<div class="search-box">
<label>BOX名（部分一致）</label>
<input id="box" placeholder="例：STEC-360">
</div>

<button onclick="search()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

const version = "2026-05";

/* ✅ CSV読み込み（列固定方式・そのまま） */
fetch('OTHER.csv?v=' + version)
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    const no        = (c[0] || '').trim();
    const name      = (c[1] || '').trim();
    const model     = (c[2] || '').trim();
    const modelName = (c[3] || '').trim();
    const machine   = (c[4] || '').trim();
    const box       = (c[5] || '').trim();
    const addr      = (c[6] || '').trim();   // ※表示しない
    const zip       = (c[7] || '').trim();   // ※表示しない
    const tel       = (c[8] || '').trim();

    return {
      no,
      name,
      model,
      modelName,
      machine,
      box,
      addr,
      zip,
      tel
    };

  });

});


/* ✅ AND検索（そのまま） */
function matchWords(text, input) {

  if (!input) return true;

  const words = input.trim().replace(/\u3000/g, ' ').split(' ').filter(w => w);

  return words.every(w => text.includes(w));
}


/* ✅ 検索（完全に変更なし） */
function search() {

  const name = document.getElementById('name').value;
  const tel = document.getElementById('tel').value;
  const model = document.getElementById('model').value.toLowerCase();
  const machine = document.getElementById('machine').value.toLowerCase();
  const box = document.getElementById('box').value.toLowerCase();

  const result = document.getElementById('result');
  result.innerHTML = '';

  data.filter(d => {

    return matchWords(d.name, name) &&
           matchWords(d.tel.replace(/-/g, ''), tel.replace(/-/g, '')) &&
           matchWords(d.modelName.toLowerCase(), model) &&
           matchWords(d.machine.toLowerCase(), machine) &&
           matchWords(d.box.toLowerCase(), box);

  }).forEach(d => {

    const card = document.createElement('div');
    card.className = 'card';

    /* ✅ 機種名称を追加（ここだけ変更） */
    card.innerHTML = `
      <div><strong>客先№：${d.no}</strong></div>
      <div>${d.name}</div>
      <div>電話：${d.tel}</div>
      <div>機種：${d.model}</div>
      <div>機種名称：${d.modelName}</div>
      <div>機械№：${d.machine}</div>
      <div>BOX：${d.box}</div>
    `;

    result.appendChild(card);

  });

}

</script>

</body>
</html>
