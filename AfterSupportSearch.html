<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アフター対応検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
}

h2 {
  margin-bottom: 12px;
}

.search-box {
  margin-bottom: 10px;
  max-width: 420px;
}

label {
  display: block;
  margin-bottom: 3px;
}

input {
  width: 400px;
  max-width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 15px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}
</style>

</head>

<body>

<h2>アフター対応検索</h2>

<div class="search-box">
<label>客先名（部分一致）</label>
<input id="name" placeholder="例：スター精機 大阪">
</div>

<div class="search-box">
<label>電話番号（部分一致）</label>
<input id="tel" placeholder="例：077123">
</div>

<div class="search-box">
<label>機種名称（部分一致）</label>
<input id="model" placeholder="例：GX-1100">
</div>

<div class="search-box">
<label>機械№（部分一致）</label>
<input id="machine" placeholder="例：GX11N-">
</div>

<div class="search-box">
<label>BOX名（部分一致）</label>
<input id="box" placeholder="例：STEC-360">
</div>

<button onclick="search()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

/* ✅ 月次バージョン（毎月変更） */
const version = "2026-05";

/* ✅ CSV読み込み（後ろから固定取得） */
fetch('OTHER.csv?v=' + version)
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    // ✅ 後ろから固定取得（ズレ防止）
    const tel   = (c.pop() || '').trim();
    const zip   = (c.pop() || '').trim();
    const addr  = (c.pop() || '').trim();
    const box   = (c.pop() || '').trim();
    const machine = (c.pop() || '').trim();
    const modelName = (c.pop() || '').trim();
    const model = (c.pop() || '').trim();
    const name  = (c.pop() || '').trim();
    const no    = (c.pop() || '').trim();

    return {
      no,
      name,
      model,
      modelName,
      machine,
      box,
      addr,
      zip,
      tel
    };

  });

  console.log("読み込み件数:", data.length);

});


/* ✅ AND検索（スペース区切り） */
function matchWords(text, input) {

  if (!input) return true;

  // 全角スペース対応
  const words = input.trim().replace(/\u3000/g, ' ').split(' ').filter(w => w);

  return words.every(w => text.includes(w));
}


/* ✅ 検索 */
function search() {

  const name = document.getElementById('name').value;
  const tel = document.getElementById('tel').value;
  const model = document.getElementById('model').value.toLowerCase();
  const machine = document.getElementById('machine').value.toLowerCase();
  const box = document.getElementById('box').value.toLowerCase();

  const result = document.getElementById('result');
  result.innerHTML = '';

  data.filter(d => {

    return matchWords(d.name, name) &&
           matchWords(d.tel, tel) &&
           matchWords(d.model.toLowerCase(), model) &&
           matchWords(d.machine.toLowerCase(), machine) &&
           matchWords(d.box.toLowerCase(), box);

  }).forEach(d => {

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div><strong>${d.name}</strong></div>
      <div>電話：${d.tel}</div>
      <div>機種：${d.model}</div>
      <div>機械№：${d.machine}</div>
      <div>BOX：${d.box}</div>
    `;

    result.appendChild(card);

  });

}

</script>

</body>
</html>
