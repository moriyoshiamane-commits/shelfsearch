<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客先検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
  overflow-x: hidden; /* 横スクロール防止 */
}

h2 {
  margin-bottom: 12px;
}

.search-box {
  margin-bottom: 10px;
}

label {
  display: block;
  margin-bottom: 3px;
}

input {
  display: block;
  width: 400px;
  max-width: 100%;   /* ✅ 横はみ出し防止 */
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 15px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}

/* ✅ スマホ専用 */
@media screen and (max-width: 600px) {

  body {
    font-size: 18px;
  }

  input {
    width: 100%;
    height: 50px;
    font-size: 18px;
  }

  button {
    width: 100%;
    height: 60px;
    font-size: 20px;
    border-radius: 10px;
  }

  .search-box {
    margin-bottom: 15px;
  }

}
</style>
</head>

<body>

<script src="auth.js"></script>

<h2>客先検索</h2>

<div class="search-box">
  <label>客先名</label>
  <input id="name" placeholder="例:スター精機 大阪">
</div>

<!-- ✅ スマホでも届く位置 -->
<button onclick="search()">検索</button>

<!-- 必要ならここに規格検索を追加 -->
<!-- <button onclick="kikaku()">規格検索</button> -->

<div id="result" class="result"></div>

<script>
let data = [];
const version = "2026-05";

fetch('CustomerMaster.csv?v=' + version)
.then(res => res.text())
.then(text => {
  const lines = text.split('\n').slice(1);

  data = lines.map(line => {
    const c = line.split(',');

    const addr = (c.pop() || '').trim();
    const zip  = (c.pop() || '').trim();
    const area = (c.pop() || '').trim();
    const fax  = (c.pop() || '').trim();
    const tel  = (c.pop() || '').trim();
    const name = (c.pop() || '').trim();
    const no   = (c.pop() || '').trim();

    return { no, name, tel, fax, area, addr, zip };
  });
});

/* 全角半角対応 */
function splitMatch(text, input) {
  if (!input) return true;

  const normText = text.normalize('NFKC');
  const normInput = input.normalize('NFKC');

  const words = normInput.replace(/\u3000/g, ' ').split(' ').filter(w => w);

  return words.every(w => normText.includes(w));
}

function search() {
  const name = document.getElementById('name').value;
  const result = document.getElementById('result');

  result.innerHTML = '';

  data.filter(d => {
    return (!name || splitMatch(d.name, name));
  }).forEach(d => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div><b>${d.name}</b></div>
      <div>〒${d.zip}</div>
      <div>${d.addr}</div>
      <div>TEL: ${d.tel}</div>
    `;

    result.appendChild(card);
  });
}
</script>

</body>
</html>
