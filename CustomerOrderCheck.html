<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アインツ 商品確認</title>

<style>
body {
  font-family: sans-serif;
  font-size: 13px;
}

/* ===== 入力欄 ===== */
input {
  background:#fff8cc;
  border:1px solid #ccc;
  padding:3px;

  text-align:left;              /* ✅ 左寄せ */
  outline:none;                 /* ✅ 横線除去① */
  box-shadow:none;              /* ✅ 横線除去② */
  -webkit-appearance:none;      /* ✅ iPhone対策 */
}

/* 客先 */
#customerCode { width:110px; }
#personName   { width:120px; }

/* 部品№ */
input.code {
  width:80px;
  text-align:left;
}

/* 数量 */
input.qty {
  width:50px;
  text-align:left;
}

/* テーブル */
table {
  border-collapse: collapse;
  width:100%;
}

/* ✅ 横線完全削除 */
td {
  border:none;
  padding:4px 2px;
}

/* ラベル */
label {
  width:50px;
  font-weight:bold;
}

/* ===== 候補 ===== */
.suggestBox {
  position:absolute;
  background:#fff;
  border:1px solid #999;
  width:200px;
  max-height:180px;
  overflow-y:auto;
  z-index:99999;
}

.suggestItem {
  padding:6px;
  font-size:13px;
  border-bottom:1px solid #eee;
}

.suggestItem:hover {
  background:#d0ebff;
}

/* ===== スマホ ===== */
@media screen and (max-width:600px){

  body {
    font-size:13px;
    margin:5px;
    padding-bottom:90px;
  }

  input {
    width:auto !important;
    font-size:13px;
    text-align:left;

    outline:none;
    box-shadow:none;
    -webkit-appearance:none;
  }

  #customerCode { width:110px !important; }
  #personName   { width:120px !important; }

  input.code { width:80px !important; }
  input.qty  { width:50px !important; }

  .specInput { width:130px !important; }

  /* コンパクト表示 */
  td {
    display:flex;
    align-items:center;
    gap:5px;
    padding:3px 0;
    border:none;
  }

  tr {
    margin-bottom:4px;
  }

  /* ボタン */
  .fixed-button {
    position:fixed;
    bottom:10px;
    left:10px;
    right:10px;
  }

  button {
    width:100%;
    height:45px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<script src="auth.js"></script>

<h2>アインツ 商品確認</h2>

客先№：<input id="customerCode"><br>
客先名：<input id="customerName"><br>
担当者名：<input id="personName"><br><br>

<table>
<tbody id="rows"></tbody>
</table>

<textarea id="output" rows="4"></textarea>

<div class="fixed-button">
<button onclick="copyForAS400()">コピペ作成</button>
</div>

<script>
let einsData = [];

/* CSV */
fetch('Eins.csv').then(r=>r.text()).then(t=>{
  const lines = t.split('\n').slice(1);
  einsData = lines.map(l=>{
    const c = l.split(',');
    return {
      code:(c[0]||'').padStart(6,'0'),
      name:c[1]||'',
      spec:c[2]||''
    };
  });
});

/* 行生成 */
for(let i=0;i<20;i++){
  const tr=document.createElement('tr');

  tr.innerHTML = `
<td><label>部品</label><input class="code" maxlength="6" onblur="checkRow(this)"></td>

<td><label>規格</label>
<input class="specInput" oninput="showSuggest(this)">
<div class="suggestBox"></div>
</td>

<td><label>品名</label><span class="name"></span></td>

<td><label>数量</label><input class="qty" maxlength="3"></td>
`;

  document.getElementById('rows').appendChild(tr);
}

/* 部品番号 */
function checkRow(el){
  const tr = el.closest('tr');
  const hit = einsData.find(d=>d.code===el.value);

  if(hit){
    tr.querySelector('.name').textContent = hit.name;
    tr.querySelector('.specInput').value = hit.spec;
  }
}

/* 検索 */
function showSuggest(el){
  const key = el.value.toLowerCase();
  const box = el.nextElementSibling;

  box.innerHTML = '';

  if(!key) return;

  einsData.filter(d =>
    d.spec.toLowerCase().includes(key) ||
    d.name.toLowerCase().includes(key)
  ).slice(0,6).forEach(d=>{

    const div = document.createElement('div');
    div.className = 'suggestItem';

    div.textContent = `${d.name}（${d.spec}）`;

    div.onclick = ()=>{
      const tr = el.closest('tr');

      tr.querySelector('.code').value = d.code;
      tr.querySelector('.specInput').value = d.spec;
      tr.querySelector('.name').textContent = d.name;

      box.innerHTML='';
    };

    box.appendChild(div);
  });
}

/* 出力 */
function copyForAS400(){
  let out='';
  document.querySelectorAll('tr').forEach(tr=>{
    const c = tr.querySelector('.code').value;
    const q = tr.querySelector('.qty').value;
    if(c && q){
      out += c + "\t" + q + "\n";
    }
  });
  document.getElementById('output').value = out;
}
</script>

</body>
</html>
