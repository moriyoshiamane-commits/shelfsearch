<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アインツ 商品確認</title>

<style>
body {
  font-family: sans-serif;
  font-size: 13px;
}

/* ===== PC ===== */
.container { display:flex; width:1400px; margin-left:10px; }
.main { width:1050px; }
.side {
  width:330px; margin-left:10px; padding-left:10px;
  border-left:1px solid #999; background:#fafafa;
}

table { border-collapse:collapse; width:100%; }
th, td { border:1px solid #999; padding:3px; }
th { background:#eee; }

/* 入力色 */
input {
  background:#fff8cc;
  border:2px solid #f0c000;
}
input:focus { background:#fff2a8; }

/* サイズ */
#customerCode { width:120px; }
#personName { width:140px; }

input.code { width:110px; text-align:center; }
input.qty { width:60px; text-align:right; }

/* ===== 候補（モノタロ風） ===== */
.suggestBox {
  position:absolute;
  background:#fff;
  border:2px solid #333;
  width:300px;
  max-height:200px;
  overflow-y:auto;
  z-index:99999;
}

.suggestItem {
  padding:8px;
  border-bottom:1px solid #ddd;
  font-size:14px;
  line-height:1.3;
}

.suggestItem:hover {
  background:#cce5ff;
}

/* ===== スマホ ===== */
@media screen and (max-width:600px){

  body {
    font-size:14px;
    margin:5px;
    overflow-x:hidden;
    padding-bottom:100px;
  }

  .container { display:block; width:100%; margin:0; }
  .main,.side { width:100%; margin:0; padding:0; border:none; }

  /* ✅ 入力は広げない */
  input {
    width:auto !important;
  }

  #customerCode { width:120px !important; }
  #personName { width:140px !important; }

  input.code { width:110px !important; }
  input.qty { width:60px !important; }

  td.spec input { width:160px !important; }

  /* 縦レイアウト */
  table,thead,tbody,tr,th,td {
    display:block;
    width:100%;
  }

  thead { display:none; }

  tr {
    border:1px solid #ccc;
    margin-bottom:8px;
    padding:6px;
  }

  td { border:none; }

  td.spec { position:relative; }

  td.no::before { content:"No："; }
  td.code::before { content:"部品№："; }
  td.name::before { content:"品名："; }
  td.spec::before { content:"規格："; }
  td.shelf::before { content:"棚番："; }
  td.qty::before { content:"数量："; }

  td::before {
    font-weight:bold;
    width:80px;
    display:inline-block;
  }

  /* 固定ボタン */
  .fixed-button {
    position:fixed;
    bottom:10px;
    left:10px;
    right:10px;
    z-index:9999;
  }

  button {
    width:100%;
    height:50px;
    font-size:16px;
  }

  /* 候補をスマホ用に広く */
  .suggestBox {
    width:90%;
    max-height:220px;
  }
}
</style>
</head>

<body>

<script src="auth.js"></script>

<div class="container">
<div class="main">

<h2>アインツ 商品確認</h2>

客先№：<input id="customerCode"><br>
客先名：<input id="customerName"><br>
担当者名：<input id="personName"><br>

<table>
<thead>
<tr>
<th>No</th><th>部品№</th><th>品名</th><th>規格</th><th>棚番</th><th>数量</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<textarea id="output" rows="5"></textarea>

</div>

<div class="side">
<h3>規格検索</h3>
<input id="specSearch">
<button onclick="searchBySpec()">検索</button>
<div id="specResults"></div>
</div>
</div>

<div class="fixed-button">
<button onclick="copyForAS400()">コピペ作成</button>
</div>

<script>
let einsData = [];

/* CSV読み込み */
fetch('Eins.csv').then(r=>r.text()).then(t=>{
  const lines = t.split('\n').slice(1);
  einsData = lines.map(l=>{
    const c=l.split(',');
    return {
      code:(c[0]||'').padStart(6,'0'),
      name:c[1]||'',
      spec:c[2]||'',
      shelf:c[4]||''
    };
  });
});

/* 行生成 */
for(let i=1;i<=20;i++){
  const tr=document.createElement('tr');

  tr.innerHTML=`
<td class="no">${i}</td>

<td class="code">
<input class="code">
</td>

<td class="name"></td>

<td class="spec" style="position:relative;">
<input oninput="showSuggest(this)">
<div class="suggestBox"></div>
</td>

<td class="shelf"></td>

<td class="qty">
<input class="qty">
</td>
`;

  document.getElementById('rows').appendChild(tr);
}

/* ✅ 候補（モノタロ式） */
function showSuggest(el){
  const key=el.value.toLowerCase();
  const box=el.nextElementSibling;
  box.innerHTML='';

  if(!key) return;

  einsData.filter(d=>
    d.spec.toLowerCase().includes(key) ||
    d.name.toLowerCase().includes(key)
  ).slice(0,6).forEach(d=>{

    const div=document.createElement('div');
    div.className='suggestItem';

    div.innerHTML = `${d.name}（${d.spec}）`;

    /* ✅ ここが一番重要（完全置き換え） */
    div.onclick=()=>{
      const tr=el.closest('tr');

      tr.querySelector('.code input').value = d.code;
      tr.querySelector('.spec input').value = d.spec;
      tr.querySelector('.name').textContent = d.name;
      tr.querySelector('.shelf').textContent = d.shelf;

      tr.className = "ok";

      box.innerHTML='';
    };

    box.appendChild(div);
  });
}

/* PC検索 */
function searchBySpec(){
  const key=document.getElementById('specSearch').value.toLowerCase();
  const box=document.getElementById('specResults');
  box.innerHTML='';

  einsData.filter(d=>
    d.spec.toLowerCase().includes(key) ||
    d.name.toLowerCase().includes(key)
  ).forEach(d=>{
    const div=document.createElement('div');
    div.innerHTML =
      `${d.code} ${d.name}<br>
       規格：${d.spec}<br>
       棚番：${d.shelf}`;
    box.appendChild(div);
  });
}

/* 出力 */
function copyForAS400(){
  let out='';
  document.querySelectorAll('tr.ok').forEach(tr=>{
    const c=tr.querySelector('.code input').value;
    const q=tr.querySelector('.qty input').value;
    if(q) out+=c+"\t"+q+"\n";
  });
  document.getElementById('output').value=out;
}
</script>

</body>
</html>
