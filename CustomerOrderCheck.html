<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アインツ 商品確認</title>

<!-- ✅ ここが重要（auth.jsはheadで実行） -->
<script src="auth.js"></script>

<style>
body {
  font-family: sans-serif;
  font-size:13px;
  margin:5px;
}

/* 入力 */
input {
  background:#fff8cc;
  border:1px solid #ddd;
  padding:3px;
  text-align:left;
}

/* サイズ */
#customerCode { width:110px; }
#personName   { width:120px; }
.input-code   { width:80px; }
.input-qty    { width:50px; }
.input-spec   { width:140px; }

/* 行 */
.row {
  padding:8px 0;
  margin-bottom:6px;
}

/* 区切り */
.row::after {
  content:"";
  display:block;
  height:1px;
  background:#e5e5e5;
  margin-top:6px;
}

/* 横並び */
.item {
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:2px;
}

/* ラベル */
.label {
  width:50px;
  font-weight:bold;
}

/* 候補 */
.suggestBox {
  position:absolute;
  background:#fff;
  border:1px solid #999;
  width:200px;
  max-height:180px;
  overflow-y:auto;
  z-index:9999;
}

.suggestItem {
  padding:6px;
  font-size:13px;
  border-bottom:1px solid #eee;
}

.suggestItem:hover {
  background:#d0ebff;
}

/* ボタン */
.fixed-button {
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
}

button {
  width:100%;
  height:45px;
  font-size:15px;
}
</style>
</head>

<body>

<h2>アインツ 商品確認</h2>

客先№：<input id="customerCode"><br>
客先名：<input id="customerName"><br>
担当者名：<input id="personName"><br><br>

<div id="rows"></div>

<textarea id="output" rows="4"></textarea>

<div class="fixed-button">
<button onclick="copyForAS400()">コピペ作成</button>
</div>

<script>
let einsData = [];

/* CSV */
fetch('Eins.csv').then(r=>r.text()).then(t=>{
  const lines = t.split('\n').slice(1);
  einsData = lines.map(l=>{
    const c = l.split(',');
    return {
      code:(c[0]||'').padStart(6,'0'),
      name:c[1]||'',
      spec:c[2]||''
    };
  });
});

/* 行生成 */
const container = document.getElementById('rows');

for(let i=0;i<20;i++){

  const row = document.createElement('div');
  row.className = "row";

  row.innerHTML = `
  <div class="item">
    <span class="label">部品</span>
    <input class="input-code" maxlength="6" onblur="checkRow(this)">
  </div>

  <div class="item" style="position:relative;">
    <span class="label">規格</span>
    <input class="input-spec" oninput="showSuggest(this)">
    <div class="suggestBox"></div>
  </div>

  <div class="item">
    <span class="label">品名</span>
    <span class="name"></span>
  </div>

  <div class="item">
    <span class="label">数量</span>
    <input class="input-qty" maxlength="3">
  </div>
  `;

  container.appendChild(row);
}

/* 部品番号入力 */
function checkRow(el){
  const row = el.closest('.row');
  const hit = einsData.find(d=>d.code===el.value);

  if(hit){
    row.querySelector('.name').textContent = hit.name;
    row.querySelector('.input-spec').value = hit.spec;
  }
}

/* 検索 */
function showSuggest(el){
  const key = el.value.toLowerCase();
  const box = el.nextElementSibling;

  box.innerHTML='';

  if(!key) return;

  einsData.filter(d =>
    d.spec.toLowerCase().includes(key) ||
    d.name.toLowerCase().includes(key)
  ).slice(0,6).forEach(d=>{

    const div = document.createElement('div');
    div.className='suggestItem';

    div.textContent = `${d.name}（${d.spec}）`;

    div.onclick = ()=>{
      const row = el.closest('.row');

      row.querySelector('.input-code').value = d.code;
      row.querySelector('.input-spec').value = d.spec;
      row.querySelector('.name').textContent = d.name;

      box.innerHTML='';
    };

    box.appendChild(div);
  });
}

/* ✅ コピー機能（完成版） */
function copyForAS400(){

  let out = '';

  const cus = document.getElementById('customerCode').value;
  const person = document.getElementById('personName').value;

  if(cus) out += "客先№：" + cus + "\n";
  if(person) out += "担当：" + person + "\n";

  out += "\n";

  document.querySelectorAll('.row').forEach(r=>{
    const c = r.querySelector('.input-code').value;
    const q = r.querySelector('.input-qty').value;
    const n = r.querySelector('.name').textContent;
    const s = r.querySelector('.input-spec').value;

    if(c && q){
      out += `${c}\t${q}\t${n}\t${s}\n`;
    }
  });

  navigator.clipboard.writeText(out).then(()=>{
    alert("コピーしました");
  });
}
</script>

</body>
</html>
