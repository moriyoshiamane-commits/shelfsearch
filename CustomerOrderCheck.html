<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アインツ 商品確認</title>

<script src="auth.js"></script>

<style>
body {
  font-family: sans-serif;
  font-size: 13px;
}

input {
  background:#fff8cc;
  border:1px solid #ccc;
  padding:3px;
  text-align:left;
}

#customerCode { width:110px; }
#personName   { width:120px; }

input.code { width:80px; }
input.qty  { width:50px; }

table {
  border-collapse: collapse;
  width:100%;
}

td {
  border-bottom:none;
  padding:4px 2px;
}

label {
  width:50px;
  font-weight:bold;
}

.suggestBox {
  position:absolute;
  background:#fff;
  border:1px solid #999;
  width:200px;
  max-height:180px;
  overflow-y:auto;
  z-index:99999;
}

.suggestItem {
  padding:6px;
  font-size:13px;
  border-bottom:1px solid #eee;
}

.suggestItem:hover {
  background:#d0ebff;
}

.fixed-button {
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
}

button {
  width:100%;
  height:45px;
  font-size:15px;
}
</style>
</head>

<body>

<h2>アインツ 商品確認</h2>

客先№：<input id="customerCode"><br>
客先名：<input id="customerName"><br>
担当者名：<input id="personName"><br><br>

<table>
<tbody id="rows"></tbody>
</table>

<textarea id="output" rows="4"></textarea>

<div class="fixed-button">
<button onclick="copyForAS400()">コピペ作成</button>
</div>

<script>
let einsData = [];

/* CSV */
fetch('./Eins.csv').then(r=>r.text()).then(t=>{
  const lines = t.split('\n').slice(1);
  einsData = lines.map(l=>{
    const c = l.split(',');
    return {
      code:(c[0]||'').padStart(6,'0'),
      name:c[1]||'',
      spec:c[2]||''
    };
  });
});

/* 行生成 */
for(let i=0;i<20;i++){
  const tr=document.createElement('tr');

  tr.innerHTML = `
<td><label>部品</label><input class="code" maxlength="6" onblur="checkRow(this)"></td>

<td><label>規格</label>
<input class="specInput" oninput="showSuggest(this)">
<div class="suggestBox"></div>
</td>

<td><label>品名</label><span class="name"></span></td>

<td><label>数量</label><input class="qty" maxlength="3"></td>
`;

  document.getElementById('rows').appendChild(tr);
}

/* 部品入力 */
function checkRow(el){
  const tr = el.closest('tr');
  const hit = einsData.find(d=>d.code===el.value);

  if(hit){
    tr.querySelector('.name').textContent = hit.name;
    tr.querySelector('.specInput').value = hit.spec;
  }
}

/* 検索 */
function showSuggest(el){
  const key = el.value.toLowerCase();
  const box = el.nextElementSibling;

  box.innerHTML='';

  if(!key) return;

  einsData.filter(d =>
    d.spec.toLowerCase().includes(key) ||
    d.name.toLowerCase().includes(key)
  ).slice(0,6).forEach(d => {

    const div = document.createElement('div');
    div.className='suggestItem';
    div.textContent = `${d.name}（${d.spec}）`;

    div.onclick = ()=>{
      const tr = el.closest('tr');

      tr.querySelector('.code').value = d.code;
      tr.querySelector('.specInput').value = d.spec;
      tr.querySelector('.name').textContent = d.name;

      box.innerHTML='';
    };

    box.appendChild(div);
  });
}

/* ✅ コピー（客先名追加） */
function copyForAS400(){

  let out = '';

  const cus = document.getElementById('customerCode').value;
  const cname = document.getElementById('customerName').value;  // ★追加
  const person = document.getElementById('personName').value;

  if(cus) out += "客先№：" + cus + "\n";
  if(cname) out += "客先名：" + cname + "\n";  // ★ここ追加
  if(person) out += "担当：" + person + "\n";

  out += "\n";

  document.querySelectorAll('tr').forEach(tr=>{
    const c = tr.querySelector('.code').value;
    const q = tr.querySelector('.qty').value;
    const n = tr.querySelector('.name').textContent;
    const s = tr.querySelector('.specInput').value;

    if(c && q){
      out += `${c}\t${q}\t${n}\t${s}\n`;
    }
  });

  navigator.clipboard.writeText(out).then(()=>{
    alert("コピーしました");
  });
}
</script>

</body>
</html>
