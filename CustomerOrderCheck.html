<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アインツ 商品確認</title>

<style>
body {
  font-family: sans-serif;
  font-size: 13px;
  background: #fff;
}

/* ===== PCレイアウト ===== */
.container { display:flex; width:1400px; margin-left:10px; }
.main { width:1050px; }
.side {
  width:330px; margin-left:10px; padding-left:10px;
  border-left:1px solid #999; background:#fafafa;
}

/* ===== 入力強調 ===== */
input {
  background:#fff8cc;
  border:2px solid #f0c000;
}
input:focus {
  background:#fff2a8;
  border:2px solid #ff9900;
}

/* ✅ サイズ最適化 */
input.code { width:120px; text-align:center; }
input.qty  { width:80px; text-align:right; }

/* ===== テーブル ===== */
table { border-collapse:collapse; width:100%; }
th, td { border:1px solid #999; padding:3px; }
th { background:#eee; }

tr.ok { background:#c8f7c5; }
tr.ng { background:#f7c5c5; }

/* ===== 候補表示 ===== */
.suggestBox {
  position:absolute;
  background:#fff;
  border:2px solid #333;
  width:95%;
  max-height:180px;
  overflow-y:auto;
  z-index:99999;
}

.suggestItem {
  padding:10px;
  border-bottom:1px solid #ccc;
}

.suggestItem:hover {
  background:#d0ebff;
}

/* =================================
   ✅ スマホ最適化
================================= */
@media screen and (max-width:600px){

  body {
    overflow-x:hidden;
    margin:5px;
    font-size:16px;
    padding-bottom:100px;
  }

  .container { display:block; width:100%; margin:0; }
  .main,.side { width:100%; margin:0; padding:0; border:none; }

  input { width:100%!important; height:45px; }

  /* ✅ 数量は小さく固定 */
  input.qty {
    width:80px !important;
    display:inline-block;
  }

  /* ✅ テーブル縦 */
  table,thead,tbody,tr,th,td {
    display:block;
    width:100%;
  }

  thead { display:none; }

  tr {
    border:1px solid #ccc;
    margin-bottom:10px;
    padding:8px;
  }

  td { border:none; }

  td.spec { position:relative; } /* ←重要 */

  td.no::before    { content:"No："; }
  td.code::before  { content:"部品№："; }
  td.name::before  { content:"品名："; }
  td.spec::before  { content:"規格："; }
  td.shelf::before { content:"棚番："; }
  td.qty::before   { content:"数量："; }

  td::before {
    font-weight:bold;
    display:inline-block;
    width:90px;
  }

  /* ✅ 追従ボタン */
  .fixed-button {
    position:fixed;
    bottom:10px;
    left:10px;
    right:10px;
    z-index:9999;
  }

  button {
    width:100%;
    height:60px;
    font-size:20px;
  }
}
</style>
</head>

<body>

<script src="auth.js"></script>

<div class="container">
<div class="main">

<h2>アインツ 商品確認</h2>

客先№：<input id="customerCode"><br>
客先名：<input id="customerName"><br>
担当者名：<input id="personName"><br>

<table>
<thead>
<tr>
<th>No</th><th>部品№</th><th>品名</th><th>規格</th><th>棚番</th><th>数量</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<textarea id="output" rows="5"></textarea>

</div>

<div class="side">

<h3>規格検索</h3>
<input id="specSearch">
<button onclick="searchBySpec()">検索</button>
<div id="specResults"></div>

</div>
</div>

<div class="fixed-button">
<button onclick="copyForAS400()">コピペ作成</button>
</div>

<script>
let einsData = [];
let lastFocusedCodeInput = null;

/* CSV読込 */
fetch('Eins.csv').then(r=>r.text()).then(t=>{
  const lines = t.split('\n').slice(1);
  einsData = lines.map(l=>{
    const c = l.split(',');
    return {
      code:(c[0]||'').padStart(6,'0'),
      name:(c[1]||''),
      spec:(c[2]||''),
      shelf:(c[4]||'')
    };
  });
});

/* 行生成 */
for(let i=1;i<=20;i++){
  const tr=document.createElement('tr');

  tr.innerHTML=`
<td class="no">${i}</td>

<td class="code">
<input class="code"
onfocus="lastFocusedCodeInput=this"
onblur="checkRow(this)">
</td>

<td class="name"></td>

<td class="spec" style="position:relative;">
<input oninput="showSuggest(this)">
<div class="suggestBox"></div>
</td>

<td class="shelf"></td>

<td class="qty">
<input class="qty">
</td>
`;

  document.getElementById('rows').appendChild(tr);
}

/* 部品№→表示 */
function checkRow(el){
  const tr=el.closest('tr');
  const hit=einsData.find(d=>d.code===el.value);

  if(hit){
    tr.className='ok';
    tr.querySelector('.name').textContent=hit.name;
    tr.querySelector('.spec input').value=hit.spec;
    tr.querySelector('.shelf').textContent=hit.shelf;
  }else{
    tr.className='ng';
  }
}

/* ✅ 候補表示（改良版） */
function showSuggest(el){
  const key=el.value.toLowerCase();
  const box=el.nextElementSibling;
  box.innerHTML='';

  if(!key) return;

  einsData.filter(d=>
    d.spec.toLowerCase().includes(key) ||
    d.name.toLowerCase().includes(key)
  ).slice(0,5).forEach(d=>{

    const div=document.createElement('div');
    div.className='suggestItem';

    div.innerHTML=`
      <b>${d.name}</b><br>
      規格：${d.spec}<br>
      棚番：${d.shelf}
    `;

    div.onclick=()=>{
      const tr=el.closest('tr');
      tr.querySelector('.code input').value=d.code;
      tr.querySelector('.code input').blur();
      box.innerHTML='';
    };

    box.appendChild(div);
  });
}

/* PC検索 */
function searchBySpec(){
  const key=document.getElementById('specSearch').value.toLowerCase();
  const box=document.getElementById('specResults');
  box.innerHTML='';

  einsData.filter(d=>
    d.spec.toLowerCase().includes(key) ||
    d.name.toLowerCase().includes(key)
  ).forEach(d=>{
    const div=document.createElement('div');
    div.innerHTML=
      `${d.code} ${d.name}<br>
       規格：${d.spec}<br>
       棚番：${d.shelf}
       <button onclick="setPartNo('${d.code}')">選択</button>`;
    box.appendChild(div);
  });
}

function setPartNo(code){
  if(lastFocusedCodeInput){
    lastFocusedCodeInput.value=code;
    lastFocusedCodeInput.blur();
  }
}

function copyForAS400(){
  let out='';
  document.querySelectorAll('tr.ok').forEach(tr=>{
    const c=tr.querySelector('.code input').value;
    const q=tr.querySelector('.qty input').value;
    if(q) out+=c+"\t"+q+"\n";
  });
  document.getElementById('output').value=out;
}
</script>

</body>
</html>
