<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アインツ商品確認</title>

<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
  overflow-x: hidden; /* ✅ 横スクロール防止 */
}

h2 {
  margin-bottom: 12px;
}

/* PC用 */
.search-box {
  margin-bottom: 10px;
}

label {
  display: block;
  margin-bottom: 3px;
}

input {
  display: block;
  width: 400px;
  max-width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 15px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 10px 0;
}

/* ✅ スマホ専用 */
@media screen and (max-width: 600px) {

  body {
    font-size: 18px;
  }

  input {
    width: 100%;
    height: 50px;
    font-size: 18px;
  }

  button {
    width: 100%;
    height: 60px;
    font-size: 20px;
    border-radius: 12px;
  }

  .search-box {
    margin-bottom: 15px;
  }

}
</style>
</head>

<body>

<script src="auth.js"></script>

<h2>アインツ商品確認</h2>

<div class="search-box">
  <label>商品名・型式</label>
  <input id="keyword" placeholder="例：エアチャック">
</div>

<!-- ✅ スマホでも押しやすい位置 -->
<button onclick="search()">検索</button>

<div id="result" class="result"></div>

<script>
let data = [];
const version = "2026-05";

/* CSV読込（元仕様維持） */
fetch('EINZ_PRODUCT.csv?v=' + version)
.then(res => res.text())
.then(text => {
  const lines = text.split('\n').slice(1);

  data = lines.map(line => {
    const c = line.split(',');

    const spec = (c.pop() || '').trim();     // 規格
    const name = (c.pop() || '').trim();     // 商品名
    const code = (c.pop() || '').trim();     // 型式

    return { code, name, spec };
  });
});

/* 全角半角対応 */
function normalize(str){
  return str.normalize('NFKC');
}

function match(text, input){
  if(!input) return true;
  return normalize(text).includes(normalize(input));
}

function search() {
  const keyword = document.getElementById('keyword').value;
  const result = document.getElementById('result');

  result.innerHTML = '';

  data.filter(d => {
    return (
      match(d.name, keyword) ||
      match(d.code, keyword) ||
      match(d.spec, keyword)
    );
  }).forEach(d => {

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div><b>${d.name}</b></div>
      <div>型式：${d.code}</div>
      <div>規格：${d.spec}</div>
    `;

    result.appendChild(card);
  });
}
</script>

</body>
</html>
