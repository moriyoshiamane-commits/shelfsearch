<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アインツ 商品確認</title>

<style>
body {
  font-family: sans-serif;
  font-size: 13px;
  background: #fff;
}

/* ===== PCそのまま ===== */
.container {
  display: flex;
  width: 1400px;
  margin-left: 10px;
}

.main {
  width: 1050px;
}

.side {
  width: 330px;
  margin-left: 10px;
  padding-left: 10px;
  border-left: 1px solid #999;
  background: #fafafa;
}

h2 {
  margin-bottom: 4px;
}

.guide {
  margin: 2px 0;
  color: #444;
}

table {
  border-collapse: collapse;
  width: 100%;
}

th, td {
  border: 1px solid #999;
  padding: 3px;
}

th {
  background: #eeeeee;
  text-align: center;
}

td.no    { width: 40px; text-align: center; }
td.code  { width: 90px; }
td.name  { width: 230px; }
td.spec  { width: 250px; }
td.shelf { width: 120px; }
td.qty   { width: 70px; text-align: center; }

input.code { width: 80px; text-align: right; }
input.qty  { width: 50px; text-align: right; }

.ok { background: #c8f7c5; }
.ng { background: #f7c5c5; }

textarea { width: 600px; }

.resultBox {
  border: 1px solid #999;
  padding: 4px;
  max-height: 420px;
  overflow-y: auto;
  background: #fff;
  font-size: 12px;
}

.resultBox div {
  padding: 3px 0;
  border-bottom: 1px dotted #ccc;
}

/* =========================================
   ✅ スマホ完全最適化（ここが本体）
========================================= */
@media screen and (max-width: 600px) {

  body {
    overflow-x: hidden;
    margin: 5px;
    font-size: 16px;
    padding-bottom: 90px;
  }

  .container {
    display: block;
    width: 100%;
    margin: 0;
  }

  .main, .side {
    width: 100%;
    margin: 0;
    padding: 0;
    border: none;
  }

  .side {
    margin-top: 20px;
  }

  input {
    width: 100% !important;
    height: 42px;
    font-size: 16px;
  }

  button {
    width: 100%;
    height: 60px;
    font-size: 20px;
    margin-top: 10px;
  }

  /* ✅ テーブルを縦に変換 */
  table, thead, tbody, tr, th, td {
    display: block;
    width: 100%;
  }

  thead {
    display: none;
  }

  tr {
    border: 1px solid #ccc;
    margin-bottom: 10px;
    padding: 5px;
  }

  td {
    border: none;
    padding: 4px 0;
  }

  td.no::before    { content: "No："; }
  td.code::before  { content: "部品№："; }
  td.name::before  { content: "品名："; }
  td.spec::before  { content: "規格："; }
  td.shelf::before { content: "棚番："; }
  td.qty::before   { content: "数量："; }

  td::before {
    font-weight: bold;
    display: inline-block;
    width: 90px;
  }

  textarea {
    width: 100%;
  }

  .resultBox {
    max-height: 250px;
  }

  /* ✅ 追従ボタン */
  .fixed-button {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    z-index: 9999;
  }

}

</style>
</head>

<body>

<script src="auth.js"></script>
  
<div class="container">

<div class="main">

<h2>アインツ 商品確認</h2>

<div>
客先№：
<input type="text" id="customerCode" maxlength="8" style="width:120px;"
placeholder="00000-00"
oninput="formatCustomerCode(this)"
onkeydown="if(event.key==='Enter'){searchCustomer();}">
<br>
客先名：
<input type="text" id="customerName" maxlength="40" style="width:320px;">
<br>
担当者名：
<input type="text" id="personName" style="width:200px;">
</div>

<p class="guide">※ 部品№入力後は Tabキーで次の項目へ進めます</p>

<table>
<thead>
<tr>
<th>No</th>
<th>部品№</th>
<th>品名</th>
<th>規格</th>
<th>棚番</th>
<th>数量</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<textarea id="output" rows="5"></textarea>

</div>

<div class="side">

<h3>規格検索</h3>

規格・品名：
<input type="text" id="specSearch">
<button onclick="searchBySpec()">検索</button>

<div id="specResults" class="resultBox"></div>

</div>

</div>

<!-- ✅ 追従ボタン -->
<div class="fixed-button">
<button onclick="copyForAS400()">コピペ作成</button>
</div>

<script>
let einsData = [];
let customerMaster = [];
let lastFocusedCodeInput = null;

fetch('Eins.csv').then(r=>r.text()).then(t=>{
  const lines = t.split('\n').slice(1);
  einsData = lines.map(l=>{
    const c = l.split(',');
    return {
      code: (c[0]||'').trim().padStart(6,'0'),
      name: (c[1]||'').trim(),
      spec: (c[2]||'').trim(),
      shelf:(c[4]||'').trim()
    };
  });
});

fetch('CustomerMaster.csv').then(r=>r.text()).then(t=>{
  const lines = t.split('\n').slice(1);
  customerMaster = lines.map(l=>{
    const c = l.split(',');
    return {
      code:(c[0]||'').trim(),
      name:(c[1]||'').trim()
    };
  });
});

const tbody = document.getElementById('rows');

for(let i=1;i<=20;i++){
  const tr = document.createElement('tr');
  tr.innerHTML = `
<td class="no">${i}</td>
<td class="code">
<input class="code" maxlength="6"
onfocus="lastFocusedCodeInput=this"
oninput="this.value=this.value.replace(/[^0-9]/g,'')"
onblur="this.value=this.value.padStart(6,'0');checkRow(this)">
</td>
<td class="name"></td>
<td class="spec"></td>
<td class="shelf"></td>
<td class="qty">
<input class="qty" maxlength="3"
oninput="this.value=this.value.replace(/[^0-9]/g,'')">
</td>`;
  tbody.appendChild(tr);
}

function checkRow(el){
  const tr = el.closest('tr');
  const hit = einsData.find(d=>d.code===el.value);

  ['name','spec','shelf'].forEach(c=>{
    tr.querySelector('.'+c).textContent='';
  });

  tr.className='';

  if(!el.value) return;

  if(hit){
    tr.className='ok';
    tr.querySelector('.name').textContent = hit.name;
    tr.querySelector('.spec').textContent = hit.spec;
    tr.querySelector('.shelf').textContent = hit.shelf;
  } else {
    tr.className='ng';
    tr.querySelector('.shelf').textContent='該当なし';
  }
}

function searchBySpec(){
  const key = document.getElementById('specSearch').value.trim().toLowerCase();
  const box = document.getElementById('specResults');
  box.innerHTML = '';

  einsData.filter(d =>
    d.spec.toLowerCase().includes(key) ||
    d.name.toLowerCase().includes(key)
  ).forEach(d=>{
    const div = document.createElement('div');
    div.innerHTML =
      `${d.code} ${d.name}<br>棚番：${d.shelf}
      <button onclick="setPartNo('${d.code}')">使う</button>`;
    box.appendChild(div);
  });
}

function setPartNo(code){
  if (lastFocusedCodeInput && !lastFocusedCodeInput.value) {
    lastFocusedCodeInput.value = code;
    lastFocusedCodeInput.blur();
    return;
  }

  const inputs = document.querySelectorAll('input.code');
  for (const i of inputs) {
    if (!i.value) {
      i.value = code;
      i.blur();
      break;
    }
  }
}

function formatCustomerCode(el){
  let v = el.value.replace(/[^0-9-]/g, '');
  if (v.includes('-')) {
    const a = v.split('-')[0].slice(0,5);
    const b = v.split('-')[1].slice(0,2);
    v = a + '-' + b;
  } else {
    v = v.slice(0,5);
  }
  el.value = v;
}

function searchCustomer(){
  const code = document.getElementById('customerCode').value.trim();
  const hit = customerMaster.find(c=>c.code===code);
  document.getElementById('customerName').value = hit ? hit.name : '（未登録）';
}

function copyForAS400(){
  let out='';
  [...tbody.children].forEach(tr=>{
    if(tr.className==='ok'){
      const c=tr.querySelector('input.code').value;
      const q=tr.querySelector('input.qty').value;
      if(q) out+=`${c}\t${q}\n`;
    }
  });
  document.getElementById('output').value=out;
}
</script>

</body>
</html>
