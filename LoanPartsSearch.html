<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品管理表</title>

<style>
body { font-family: sans-serif; padding: 20px; }

.wrap { max-width: 500px; }

input, select {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
  box-sizing: border-box;
}

.button {
  display: inline-block;
  background: linear-gradient(#5b86e5, #4a6fcf);
  color: white;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 10px;
}

.card {
  border-top: 1px solid #ccc;
  padding: 10px 0;
}
</style>
</head>

<body>

<div class="wrap">

<h1>貸出部品管理表</h1>

<div id="status">読込中…</div>

<select id="office">
  <option value="">すべて</option>
</select>

<input id="keyword" placeholder="部品№ / 品名 / 規格">

<div class="button" onclick="search()">検索</div>

<div id="count"></div>
<div id="result"></div>

<hr>

<h2>規格から保管部署検索</h2>

<input id="spec">
<div id="specResult"></div>

</div>

<script>
let data = [];

// ✅ 絶対パス指定（ここが最重要）
fetch("/shelfsearch/LoanParts.csv?" + new Date().getTime())
.then(res => {
  if (!res.ok) throw new Error("NG");
  return res.text();
})
.then(text => {

  document.getElementById("status").innerText = "CSV読込OK";

  const rows = text.split("\n");
  rows.shift();

  rows.forEach(row => {

    if (!row.trim()) return;

    let col = [];
    let current = "";
    let inQuotes = false;

    for (let i = 0; i < row.length; i++) {
      const c = row[i];

      if (c === '"') {
        inQuotes = !inQuotes;
        continue;
      }

      if (c === ',' && !inQuotes) {
        col.push(current);
        current = "";
      } else {
        current += c;
      }
    }
    col.push(current);

    if (col.length < 6) return;

    data.push({
      部品№: col[0].trim(),
      品名: col[1].trim(),
      規格: col[2].trim(),
      Cereal: col[3].trim(),
      保管部署: col[col.length - 1].trim()
    });

  });

  initOffice();

})
.catch(e => {
  document.getElementById("status").innerText = "CSV読込失敗";
});

// 保管部署
function initOffice() {
  const sel = document.getElementById("office");
  const list = [...new Set(data.map(d => d.保管部署))];

  list.forEach(o => {
    if (!o) return;
    const op = document.createElement("option");
    op.value = o;
    op.text = o;
    sel.appendChild(op);
  });
}

// 検索
function search() {

  const key = document.getElementById("keyword").value.toLowerCase();
  const office = document.getElementById("office").value;

  const result = data.filter(d =>
    (office === "" || d.保管部署 === office) &&
    (d.部品№.includes(key) ||
     d.品名.toLowerCase().includes(key) ||
     d.規格.toLowerCase().includes(key))
  );

  const div = document.getElementById("result");
  const count = document.getElementById("count");

  count.innerText = result.length + " 件";
  div.innerHTML = result.length
    ? result.map(d => `
      <div class="card">
        <b>${d.部品№}</b> ${d.品名}<br>
        規格：${d.規格}<br>
        保管部署：${d.保管部署}
      </div>
    `).join("")
    : "該当なし";
}

// 規格検索
document.getElementById("spec").addEventListener("input", function() {
  const val = this.value.toLowerCase();
  const set = new Set();

  data.forEach(d => {
    if (d.規格.toLowerCase().includes(val)) {
      set.add(d.保管部署);
    }
  });

  document.getElementById("specResult").innerText =
    set.size ? [...set].join(" / ") : "";
});
</script>

</body>
</html>
``
