<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品管理表</title>

<style>
body { font-family: sans-serif; padding: 20px; }
.wrap { max-width: 500px; }

input, select {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
  box-sizing: border-box;
}

.button {
  display: inline-block;
  background: linear-gradient(#5b86e5, #4a6fcf);
  color: white;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 10px;
}

.card { border-top: 1px solid #ccc; padding: 10px 0; }
</style>
</head>

<body>

<div class="wrap">

<h1>貸出部品管理表</h1>

<div id="status">読込中…</div>

<select id="office">
  <option value="">すべて</option>
</select>

<input id="keyword">

<div class="button" onclick="search()">検索</div>

<div id="count"></div>
<div id="result"></div>

</div>

<script>
let data = [];

// ✅ 5秒で強制終了
let timeout = setTimeout(() => {
  document.getElementById("status").innerText = "読込タイムアウト";
}, 5000);

// ✅ fetch
fetch("https://moriyoshiamane-commits.github.io/shelfsearch/LoanParts.csv")
.then(res => {
  clearTimeout(timeout); // ← 成功したら止める
  return res.text();
})
.then(text => {

  document.getElementById("status").innerText = "CSV読込OK";

  const rows = text.split("\n");
  rows.shift();

  rows.forEach(row => {
    if (!row.trim()) return;

    let col = [];
    let cur = "";
    let q = false;

    for (let c of row) {
      if (c === '"') { q = !q; continue; }
      if (c === ',' && !q) {
        col.push(cur); cur="";
      } else {
        cur += c;
      }
    }
    col.push(cur);

    data.push({
      部品№: col[0],
      品名: col[1],
      規格: col[2],
      保管部署: col[col.length - 1]
    });
  });

  initOffice();
})
.catch(() => {
  document.getElementById("status").innerText = "CSV読込失敗";
});

// 保管部署
function initOffice() {
  const sel = document.getElementById("office");
  [...new Set(data.map(d => d.保管部署))].forEach(o => {
    const op = document.createElement("option");
    op.value = o;
    op.text = o;
    sel.appendChild(op);
  });
}

// 検索
function search() {
  const key = document.getElementById("keyword").value.toLowerCase();
  const office = document.getElementById("office").value;

  const list = data.filter(d =>
    (office === "" || d.保管部署 === office) &&
    (d.部品№.includes(key) ||
     d.品名.toLowerCase().includes(key) ||
     d.規格.toLowerCase().includes(key))
  );

  document.getElementById("count").innerText = list.length + " 件";
  document.getElementById("result").innerHTML =
    list.length ? list.map(d => `
      <div class="card">
        <b>${d.部品№}</b> ${d.品名}<br>
        ${d.規格}<br>
        ${d.保管部署}
      </div>
    `).join("") : "該当なし";
}
</script>

</body>
</html>
