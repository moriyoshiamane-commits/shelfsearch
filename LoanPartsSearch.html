<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品管理表</title>

<style>
body { font-family: sans-serif; padding: 20px; }

input, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  box-sizing: border-box;
}

button {
  background: linear-gradient(#5b86e5, #4a6fcf);
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  font-size: 16px;
}

.card {
  border-top: 1px solid #ccc;
  padding: 10px 0;
}

@media (max-width: 600px) {
  button { width: 100%; }
}
</style>
</head>

<body>

<h1>貸出部品管理表</h1>

<select id="office">
  <option value="">すべて</option>
</select>

<input id="keyword" placeholder="部品№ / 品名 / 規格">

<button onclick="search()">検索</button>

<div id="count"></div>
<div id="result"></div>

<hr>

<h2>規格から保管部署検索</h2>

<input id="spec">
<div id="specResult"></div>

<script>
let data = [];

fetch("LoanParts.csv")
.then(res => res.text())
.then(text => {

  const rows = text.split("\n");

  // ヘッダー削除
  rows.shift();

  rows.forEach(row => {

    if (!row.trim()) return;

    const col = row.split(",");

    data.push({
      部品№: col[0] || "",
      品名: col[1] || "",
      規格: col[2] || "",
      保管部署: col[5] || ""
    });

  });

  initOffice();
});

// 保管部署
function initOffice() {
  const list = [...new Set(data.map(d => d.保管部署))];
  const sel = document.getElementById("office");

  list.forEach(o => {
    const op = document.createElement("option");
    op.value = o;
    op.text = o;
    sel.appendChild(op);
  });
}

// 検索
function search() {

  const key = document.getElementById("keyword").value.toLowerCase();
  const office = document.getElementById("office").value;

  const result = data.filter(d => {
    return (
      (office === "" || d.保管部署 === office) &&
      (
        d.部品№.includes(key) ||
        d.品名.toLowerCase().includes(key) ||
        d.規格.toLowerCase().includes(key)
      )
    );
  });

  render(result);
}

// 表示
function render(list) {

  const div = document.getElementById("result");
  const count = document.getElementById("count");

  div.innerHTML = "";
  count.innerHTML = list.length + " 件";

  list.forEach(d => {

    div.innerHTML += `
      <div class="card">
        <b>${d.部品№}</b> ${d.品名}<br>
        規格：${d.規格}<br>
        保管部署：${d.保管部署}
      </div>
    `;
  });

  if (list.length === 0) {
    div.innerHTML = "該当なし";
  }
}

// 規格検索
document.getElementById("spec").addEventListener("input", function() {

  const val = this.value.toLowerCase();
  const set = new Set();

  data.forEach(d => {
    if (d.規格.toLowerCase().includes(val)) {
      set.add(d.保管部署);
    }
  });

  document.getElementById("specResult").innerText =
    set.size ? "該当部署：" + [...set].join(" / ") : "該当なし";
});
</script>

</body>
</html>
