<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 14px;
  margin: 10px;
}

.search-box { margin-bottom: 10px; }

input[type="text"] {
  width: 320px;
  height: 32px;
}

button {
  padding: 8px 18px;
  background: linear-gradient(#5b8de3,#3f6ac7);
  color: #fff;
  border: none;
  border-radius: 6px;
}

.result { margin-top: 15px; }

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}
</style>
</head>

<body>

<h2>貸出部品検索</h2>

<div class="search-box">
<label>部品№ / 規格</label>
<input type="text" id="keyword">
</div>

<div class="search-box">
<label>保管部署</label>
<input type="text" id="location" placeholder="例：大阪">
</div>

<button onclick="searchParts()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    // ✅ 一度シンプルに処理
    const c = line.split(',');

    // ✅ 規格のカンマ結合処理（ここがポイント）
    let spec = c[2] || '';

    if (c.length > 5) {
      spec = c.slice(2, c.length - 2).join(',');
    }

    return {
      code: (c[0] || '').trim(),
      name: (c[1] || '').trim(),
      spec: spec.replace(/"/g,'').trim(),
      cereal: (c[c.length - 2] || '').trim(),
      loc: (c[c.length - 1] || '').trim()
    };

  });

});

/* ===== 検索 ===== */
function searchParts() {

  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();
  const result = document.getElementById('result');

  result.innerHTML = '';

  data.filter(d => {

    const keyMatch =
      !key ||
      d.code.includes(key) ||
      d.spec.toLowerCase().includes(key);

    const locMatch =
      !loc ||
      d.loc.includes(loc);

    return keyMatch && locMatch;

  }).forEach(d => {

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div><strong>${d.code}　${d.name}</strong></div>
      <div>規格：${d.spec}</div>
      <div>シリアル：${d.cereal || ''}</div>
      <div>保管部署：${d.loc}</div>
    `;

    result.appendChild(card);

  });

}

</script>

</body>
</html>
