<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貸出部品検索</title>

<style>

/* レイアウト */
.container {
  display: flex;
  gap: 20px;
}

/* 左：検索 */
.left {
  flex: 1;
}

/* 右：貸出先表示 */
.right {
  width: 250px;
  border-left: 1px solid #ccc;
  padding-left: 10px;
}

body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
  max-width: 900px;
}

h2 {
  margin-bottom: 10px;
}

input[type="text"] {
  width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 8px 16px;
  background: linear-gradient(#5b8de3,#3f6ac7);
  color: #fff;
  border: none;
  border-radius: 6px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}

.result {
  margin-top: 15px;
}

/* 右側表示 */
.borrow {
  background: #f7f7f7;
  padding: 8px;
  margin-bottom: 10px;
  border-radius: 5px;
}

</style>
</head>

<body>

<h2>貸出部品検索</h2>

<div class="container">

<!-- 左側 -->
<div class="left">

<label>部品№ / 規格</label>
<input type="text" id="keyword">

<label>保管部署</label>
<input type="text" id="location" placeholder="例：大阪">

<button onclick="searchParts()">検索</button>

<div id="result" class="result"></div>

</div>

<!-- 右側 -->
<div class="right">
<h3>貸出先</h3>
<div id="borrowInfo"></div>
</div>

</div>

<script>

let data = [];

/* ===== CSV読み込み ===== */
fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    let spec = c[2] || '';

    if (c.length > 5) {
      spec = c.slice(2, c.length - 3).join(',');
    }

    return {
      code: (c[0] || '').trim(),
      name: (c[1] || '').trim(),
      spec: spec.replace(/"/g,'').trim(),
      cereal: (c[c.length - 3] || '').trim(),
      loc: (c[c.length - 2] || '').trim(),
      borrowNo: (c[c.length - 1] || '').trim(),
      borrowName: (c[c.length] || '').trim() // ※後述で補正
    };

  });

});

/* ===== 検索 ===== */
function searchParts() {

  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();

  const result = document.getElementById('result');
  const borrow = document.getElementById('borrowInfo');

  result.innerHTML = '';
  borrow.innerHTML = '';

  const filtered = data.filter(d => {

    const keyMatch =
      !key ||
      d.code.includes(key) ||
      d.spec.toLowerCase().includes(key);

    const locMatch =
      !loc ||
      d.loc.includes(loc);

    return keyMatch && locMatch;

  });

  filtered.forEach(d => {

    // 左側表示
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div><strong>${d.code}　${d.name}</strong></div>
      <div>規格：${d.spec}</div>
      ${d.cereal ? `<div>シリアル：${d.cereal}</div>` : ''}
      <div>保管部署：${d.loc}</div>
    `;

    result.appendChild(card);

    // 右側表示（貸出先）
    if (d.borrowNo || d.borrowName) {

      const div = document.createElement('div');
      div.className = 'borrow';

      div.innerHTML = `
        <div><strong>${d.borrowNo}</strong></div>
        <div>${d.borrowName}</div>
      `;

      borrow.appendChild(div);
    }

  });

}

</script>

</body>
</html>
