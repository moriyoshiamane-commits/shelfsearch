<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貸出部品検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 14px;
  margin: 10px;
}

h2 { margin-bottom: 10px; }

.search-box { margin-bottom: 10px; }

label { display: block; margin-bottom: 3px; }

input[type="text"] {
  width: 300px;
  height: 30px;
  font-size: 14px;
}

button {
  padding: 6px 14px;
  background: linear-gradient(#5b8de3,#3f6ac7);
  color: #fff;
  border: none;
  border-radius: 5px;
}

.result div {
  border-bottom: 1px dotted #ccc;
  padding: 6px 0;
}
</style>
</head>

<body>

<h2>貸出部品検索</h2>

<div class="search-box">
<label>部品№ / 規格</label>
<input type="text" id="keyword">
</div>

<div class="search-box">
<label>保管部署</label>
<input type="text" id="location" placeholder="例：大阪">
</div>

<button onclick="searchParts()">検索</button>

<div id="result" class="result"></div>

<script>
let data = [];

fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {
  const lines = text.split('\n').slice(1);
  data = lines.map(l => {
    const c = l.split(',');
    return {
      code: (c[0]||'').trim(),
      name: (c[1]||'').trim(),
      spec: (c[2]||'').trim(),
      loc:  (c[5]||'').trim()
    };
  });
});

function searchParts() {
  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();
  const result = document.getElementById('result');
  result.innerHTML = '';

  data.filter(d => {

    // ★① まずキーワード条件
    const keyMatch =
      !key ||
      d.code.includes(key) ||
      d.spec.toLowerCase().includes(key);

    // ★② 場所条件（入力されてたらだけ効く）
    const locMatch =
      !loc ||
      d.loc.includes(loc);

    return keyMatch && locMatch;

  }).forEach(d => {

    const div = document.createElement('div');
    div.innerHTML = `
      <strong>${d.code}</strong> ${d.name}<br>
      規格：${d.spec}<br>
      保管：${d.loc}
    `;

    result.appendChild(div);
  });
}
</script>

</body>
</html>
