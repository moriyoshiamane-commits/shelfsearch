<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品管理表</title>

<style>
body { font-family: sans-serif; padding: 20px; }
input, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  box-sizing: border-box;
}
button {
  background: linear-gradient(#5b86e5, #4a6fcf);
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  font-size: 16px;
}
.card { border-top: 1px solid #ccc; padding: 10px 0; }
@media (max-width: 600px) {
  button { width: 100%; }
}
</style>
</head>

<body>

<h1>貸出部品管理表</h1>

<select id="office">
  <option value="">すべて</option>
</select>

<input id="keyword" placeholder="部品№ / 品名 / 規格">

<button onclick="search()">検索</button>

<div id="count"></div>
<div id="result"></div>

<hr>

<h2>規格から保管部署検索</h2>

<input id="spec">
<div id="specResult"></div>

<script>
let data = [];

// ✅ 読込（カンマ無視版）
fetch("./LoanParts.csv?=" + new Date().getTime())
.then(res => res.text())
.then(text => {

  const rows = text.split("\n");
  rows.shift();

  rows.forEach(row => {

    if (!row.trim()) return;

    // ✅ ここが変更点
    const col = row.split(",");

    const part = col[0] || "";
    const name = col[1] || "";

    // ✅ 規格は「途中全部つなぐ」
    const spec = col.slice(2, col.length - 3).join(",");

    // ✅ 最後から取得（ここが重要）
    const office = col[col.length - 1];

    data.push({
      部品№: part.replace(/"/g, "").trim(),
      品名: name.replace(/"/g, "").trim(),
      規格: spec.replace(/"/g, "").trim(),
      保管部署: (office || "").replace(/"/g, "").trim()
    });

  });

  initOffice();
});

// 保管部署
function initOffice() {
  const list = [...new Set(data.map(d => d.保管部署))];
  const sel = document.getElementById("office");

  list.forEach(o => {
    if (!o) return;
    const op = document.createElement("option");
    op.value = o;
    op.text = o;
    sel.appendChild(op);
  });
}

// 検索
function search() {
  const key = document.getElementById("keyword").value.toLowerCase().trim();
  const office = document.getElementById("office").value;

  const result = data.filter(d => {
    return (
      (office === "" || d.保管部署 === office) &&
      (
        d.部品№.includes(key) ||
        d.品名.toLowerCase().includes(key) ||
        d.規格.toLowerCase().includes(key)
      )
    );
  });

  render(result);
}

// 表示
function render(list) {
  const div = document.getElementById("result");
  const count = document.getElementById("count");

  div.innerHTML = "";
  count.innerHTML = list.length + " 件";

  if (list.length === 0) {
    div.innerHTML = "該当なし";
    return;
  }

  list.forEach(d => {
    div.innerHTML += `
      <div class="card">
        <b>${d.部品№}</b> ${d.品名}<br>
        規格：${d.規格}<br>
        保管部署：${d.保管部署}
      </div>
    `;
  });
}

// 規格検索
document.getElementById("spec").addEventListener("input", function() {

  const val = this.value.toLowerCase().trim();
  const set = new Set();

  data.forEach(d => {
    if (d.規格.toLowerCase().includes(val)) {
      set.add(d.保管部署);
    }
  });

  document.getElementById("specResult").innerText =
    set.size ? "該当部署：" + [...set].join(" / ") : "該当なし";
});
</script>

</body>
</html>
