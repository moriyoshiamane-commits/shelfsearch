<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品管理表</title>

<style>
body { font-family: sans-serif; padding: 20px; }
.wrap { max-width: 500px; }

input, select {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
  box-sizing: border-box;
}

.button {
  display: inline-block;
  background: linear-gradient(#5b86e5, #4a6fcf);
  color: white;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 10px;
}

.card { border-top: 1px solid #ccc; padding: 10px 0; }
</style>
</head>

<body>

<div class="wrap">

<h1>貸出部品管理表</h1>

<div id="status">動作確認OK</div>

<select id="office">
  <option value="">すべて</option>
  <option value="大阪">大阪</option>
</select>

<input id="keyword" placeholder="部品№ / 品名 / 規格">

<div class="button" onclick="search()">検索</div>

<div id="count"></div>
<div id="result"></div>

</div>

<script>
const data = [
  {部品№:"331191", 品名:"ペンダントユニット", 規格:"PS1-1.5B", 保管部署:"大阪"},
  {部品№:"260702", 品名:"AD入力基板", 規格:"ADIN", 保管部署:"大阪"}
];

function search() {

  const key = document.getElementById("keyword").value.toLowerCase();
  const office = document.getElementById("office").value;

  const result = data.filter(d =>
    (office === "" || d.保管部署 === office) &&
    (
      d.部品№.includes(key) ||
      d.品名.toLowerCase().includes(key) ||
      d.規格.toLowerCase().includes(key)
    )
  );

  document.getElementById("count").innerText = result.length + " 件";
  document.getElementById("result").innerHTML =
    result.length
      ? result.map(d => `
        <div class="card">
          <b>${d.部品№}</b> ${d.品名}<br>
          ${d.規格}<br>
          ${d.保管部署}
        </div>
      `).join("")
      : "該当なし";
}
</script>

</body>
</html>
