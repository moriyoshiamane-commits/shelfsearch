<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品管理表</title>

<style>
body { font-family: sans-serif; padding: 20px; }

.wrap { max-width: 500px; }

input, select {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
  box-sizing: border-box;
}

.button {
  display: inline-block;
  background: linear-gradient(#5b86e5, #4a6fcf);
  color: white;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 10px;
}

.card {
  border-top: 1px solid #ccc;
  padding: 10px 0;
}
</style>
</head>

<body>

<div class="wrap">

<h1>貸出部品管理表</h1>

<div id="status">読込OK</div>

<select id="office">
  <option value="">すべて</option>
</select>

<input id="keyword" placeholder="部品№ / 品名 / 規格">

<div class="button" onclick="search()">検索</div>

<div id="count"></div>
<div id="result"></div>

<hr>

<h2>規格から保管部署検索</h2>

<input id="spec">
<div id="specResult"></div>

</div>

<script>
let data = [];

// ✅ CSVを直接埋め込み（テスト用）
const csv = `部品№,品名,規格,Cereal,注記,保管部署
331191,ペンダントユニット（銘板無),"PS1-1.5B (STEC-S1,STD)",03845,,大阪
331191,ペンダントユニット（銘板無),"PS1-1.5B (STEC-S1,STD)",A0932,,大阪
260702,ＡＤ入力基板,ADIN(100559-ADI-PR01),1210836B,,大阪`;

const rows = csv.split("\n");
rows.shift();

rows.forEach(row => {

  if (!row.trim()) return;

  let col = [];
  let cur = "";
  let q = false;

  for (let i = 0; i < row.length; i++) {
    const c = row[i];

    if (c === '"') { q = !q; continue; }

    if (c === ',' && !q) {
      col.push(cur); cur="";
    } else {
      cur += c;
    }
  }
  col.push(cur);

  data.push({
    部品№: col[0],
    品名: col[1],
    規格: col[2],
    保管部署: col[col.length - 1]
  });
});

initOffice();

// 保管部署
function initOffice() {
  const sel = document.getElementById("office");
  const list = [...new Set(data.map(d => d.保管部署))];

  list.forEach(o => {
    const op = document.createElement("option");
    op.value = o;
    op.text = o;
    sel.appendChild(op);
  });
}

// 検索
function search() {

  const key = document.getElementById("keyword").value.toLowerCase();
  const office = document.getElementById("office").value;

  const result = data.filter(d =>
    (office === "" || d.保管部署 === office) &&
    (d.部品№.includes(key) ||
     d.品名.toLowerCase().includes(key) ||
     d.規格.toLowerCase().includes(key))
  );

  const div = document.getElementById("result");
  const count = document.getElementById("count");

  count.innerText = result.length + " 件";
  div.innerHTML = result.length
    ? result.map(d => `
      <div class="card">
        <b>${d.部品№}</b> ${d.品名}<br>
        規格：${d.規格}<br>
        保管部署：${d.保管部署}
      </div>
    `).join("")
    : "該当なし";
}

// 規格検索
document.getElementById("spec").addEventListener("input", function() {
  const val = this.value.toLowerCase();
  const set = new Set();

  data.forEach(d => {
    if (d.規格.toLowerCase().includes(val)) {
      set.add(d.保管部署);
    }
  });

  document.getElementById("specResult").innerText =
    set.size ? [...set].join(" / ") : "";
});
</script>

</body>
</html>
