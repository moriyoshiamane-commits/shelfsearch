<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貸出部品検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 14px;
  margin: 10px;
}

h2 {
  margin-bottom: 10px;
}

.search-box {
  margin-bottom: 10px;
}

label {
  display: block;
  margin-bottom: 3px;
}

input[type="text"] {
  width: 320px;
  height: 32px;
  font-size: 14px;
}

button {
  padding: 8px 18px;
  background: linear-gradient(#5b8de3,#3f6ac7);
  color: #fff;
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 15px;
}

.result div {
  padding: 6px 0;
  border-bottom: 1px dotted #ccc;
}
</style>
</head>

<body>

<h2>貸出部品検索</h2>

<div class="search-box">
<label>部品№ / 規格</label>
<input type="text" id="keyword">
</div>

<div class="search-box">
<label>保管部署</label>
<input type="text" id="location" placeholder="例：大阪">
</div>

<button onclick="searchParts()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {

  const lines = text.split('\n')
                    .map(l => l.trim())
                    .filter(l => l !== '');

  data = [];

  // ✅ 5行1レコード
  for (let i = 1; i < lines.length; i += 5) {

    data.push({
      code: lines[i],
      name: lines[i+1],
      spec: lines[i+2],
      cereal: lines[i+3],
      loc: lines[i+4]
    });

  }

});

function searchParts() {

  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();

  const result = document.getElementById('result');
  result.innerHTML = '';

  data
    .filter(d => {

      const keyMatch =
        !key ||
        d.code.includes(key) ||
        d.spec.toLowerCase().includes(key);

      const locMatch =
        !loc ||
        d.loc.includes(loc);

      return keyMatch && locMatch;

    })
    .forEach(d => {

      const div = document.createElement('div');

      // ✅ 以前と同じ1行表示
      div.textContent =
        d.code + " " +
        d.name + "（" +
        d.spec + "） 保管：" +
        d.loc;

      result.appendChild(div);

    });

}

</script>

</body>
</html>
