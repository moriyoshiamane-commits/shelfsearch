<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貸出部品検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 14px;
  margin: 10px;
}

h2 { margin-bottom: 10px; }

.search-box { margin-bottom: 10px; }

label { display: block; margin-bottom: 3px; }

input[type="text"] {
  width: 320px;
  height: 32px;
  font-size: 14px;
  padding: 4px 6px;
  box-sizing: border-box;
}

button {
  padding: 8px 18px;
  margin-top: 10px;
  background: linear-gradient(#5b8de3,#3f6ac7);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.result {
  margin-top: 15px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}
</style>
</head>

<body>

<h2>貸出部品検索</h2>

<div class="search-box">
  <label>部品№ / 規格</label>
  <input type="text" id="keyword">
</div>

<div class="search-box">
  <label>保管部署</label>
  <input type="text" id="location" placeholder="例：大阪">
</div>

<button onclick="searchParts()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

/* ===== CSV読み込み（6行1レコード対応） ===== */
fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {

  const lines = text.split('\n')
                    .map(l => l.trim())
                    .filter(l => l !== '');

  // ★6行まとめて1件にする
  for (let i = 1; i < lines.length; i += 6) {

    data.push({
      code: lines[i] || '',
      name: lines[i+1] || '',
      spec: (lines[i+2] || '').replace(/"/g,''),
      cereal: lines[i+3] || '',
      note: lines[i+4] || '',
      loc: lines[i+5] || ''
    });
  }

});

/* ===== 検索処理 ===== */
function searchParts() {

  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();

  const result = document.getElementById('result');
  result.innerHTML = '';

  data
    .filter(d => {

      const keyMatch =
        !key ||
        d.code.includes(key) ||
        d.spec.toLowerCase().includes(key);

      const locMatch =
        !loc ||
        d.loc.includes(loc);

      return keyMatch && locMatch;
    })
    .forEach(d => {

      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <strong>${d.code}　${d.name}</strong><br>
        規格：${d.spec}<br>
        保管部署：${d.loc}
      `;

      result.appendChild(div);

    });
}

</script>

</body>
</html>
``
