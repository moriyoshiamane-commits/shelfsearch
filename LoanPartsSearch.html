<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貸出部品検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 14px;
  margin: 10px;
}

h2 { margin-bottom: 10px; }

.search-box { margin-bottom: 10px; }

label { display: block; margin-bottom: 3px; }

input[type="text"] {
  width: 320px;
  height: 32px;
  font-size: 14px;
  padding: 4px 6px;
  box-sizing: border-box;
}

button {
  padding: 8px 18px;
  margin-top: 10px;
  background: linear-gradient(#5b8de3,#3f6ac7);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.result {
  margin-top: 15px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}

.card div {
  margin: 2px 0;
}
</style>
</head>

<body>

<h2>貸出部品検索</h2>

<div class="search-box">
  <label>部品№ / 規格</label>
  <input type="text" id="keyword">
</div>

<div class="search-box">
  <label>保管部署</label>
  <input type="text" id="location" placeholder="例：大阪">
</div>

<button onclick="searchParts()">検索</button>

<div id="result" class="result"></div>

<script>
let data = [];

/* ===== CSV 読み込み（カンマ対策版） ===== */
fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    // ✅ カンマ入り規格対応
    const c = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);

    return {
      code: (c[0] || '').replace(/"/g,'').trim(),
      name: (c[1] || '').replace(/"/g,'').trim(),
      spec: (c[2] || '').replace(/"/g,'').trim(),
      loc:  (c[5] || '').replace(/"/g,'').trim()
    };
  });

});

/* ===== 検索処理 ===== */
function searchParts() {

  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();

  const result = document.getElementById('result');
  result.innerHTML = '';

  data
    .filter(d => {

      /* ① キーワード（部品№ or 規格） */
      const keyMatch =
        !key ||
        d.code.includes(key) ||
        d.spec.toLowerCase().includes(key);

      /* ② 場所（入力された時だけ効く） */
      const locMatch =
        !loc ||
        d.loc.includes(loc);

      return keyMatch && locMatch;
    })
    .forEach(d => {

      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div><strong>${d.code}　${d.name}</strong></div>
        <div>規格：${d.spec}</div>
        <div>保管部署：${d.loc}</div>
      `;

      result.appendChild(card);
    });

}
</script>

</body>
</html>
