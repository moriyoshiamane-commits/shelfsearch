<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貸出部品検索</title>

<style>

body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
  max-width: none;
}

h2 {
  margin-bottom: 12px;
}

.search-box {
  margin-bottom: 12px;
  max-width: 420px;
}

input[type="text"] {
  width: 400px;
  max-width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 10px 0;
}

.borrow {
  color: red;
  font-weight: bold;
}

.yellow { background: #fff3cd; }
.red { background: #f8d7da; }

</style>
</head>

<body>

<script src="auth.js"></script>

<h2>貸出部品検索</h2>

<div class="search-box">
<label>部品№ / 規格</label>
<input type="text" id="keyword" onkeydown="if(event.key==='Enter') searchParts();">
</div>

<div class="search-box">
<label>保管部署</label>
<input type="text" id="location" onkeydown="if(event.key==='Enter') searchParts();">
</div>

<!-- ✅ 追加ここ -->
<div class="search-box">
<label>
<input type="checkbox" id="borrowOnly">
貸出中のみ表示
</label>
</div>

<button onclick="searchParts()">検索</button>

<div id="result"></div>

<script>

let data = [];

fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    const borrowName = (c.pop() || '').trim();
    const borrowNo   = (c.pop() || '').trim();
    const borrowDate = (c.pop() || '').trim();
    const loc        = (c.pop() || '').trim();
    const cereal     = (c.pop() || '').trim();

    const spec = c.slice(2).join(',').replace(/"/g,'');

    return {
      code: (c[0] || '').trim(),
      name: (c[1] || '').trim(),
      spec: spec.trim(),
      cereal,
      loc,
      borrowDate,
      borrowNo,
      borrowName
    };

  });

});

function daysBetween(dateStr) {
  if (!dateStr) return 0;
  const today = new Date();
  const past = new Date(dateStr);
  return Math.floor((today - past) / (1000 * 60 * 60 * 24));
}

function searchParts() {

  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();
  const borrowOnly = document.getElementById('borrowOnly').checked;

  const result = document.getElementById('result');
  result.innerHTML = '';

  data
    .filter(d => {

      const keyMatch =
        !key ||
        d.code.includes(key) ||
        d.spec.toLowerCase().includes(key);

      const locMatch =
        !loc ||
        d.loc.includes(loc);

      const borrowMatch =
        !borrowOnly || d.borrowName;

      return keyMatch && locMatch && borrowMatch;

    })
    .sort((a, b) => {
      if (a.borrowName && !b.borrowName) return -1;
      if (!a.borrowName && b.borrowName) return 1;
      return 0;
    })
    .forEach(d => {

      const card = document.createElement('div');
      card.className = 'card';

      const days = daysBetween(d.borrowDate);

      if (days >= 90) card.classList.add('red');
      else if (days >= 30) card.classList.add('yellow');

      card.innerHTML = `
        <div><strong>${d.code}　${d.name}</strong></div>
        <div>規格：${d.spec}</div>
        ${d.cereal ? `<div>シリアル：${d.cereal}</div>` : ''}
        <div>保管部署：${d.loc}</div>

        ${d.borrowName ? `<div class="borrow">貸出中：${d.borrowName}</div>` : ''}
        ${d.borrowDate ? `<div class="borrow">貸出日：${d.borrowDate}（${days}日）</div>` : ''}
      `;

      result.appendChild(card);

    });

}

</script>

</body>
</html>
