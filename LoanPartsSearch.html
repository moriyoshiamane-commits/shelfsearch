<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貸出部品検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
}

/* スマホ対応 */
@media (max-width: 600px) {
  body {
    max-width: 500px;
    margin: 10px auto;
  }
}

h2 {
  margin-bottom: 12px;
  font-size: 22px;
}

.search-box {
  margin-bottom: 12px;
}

input[type="text"] {
  width: 100%;
  height: 36px;
  font-size: 16px;
  padding: 4px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 16px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 10px 0;
}

.card div {
  margin: 4px 0;
}

/* 貸出表示 */
.borrow {
  font-weight: bold;
}

/* ✅ 色分け */
.yellow { background: #fff3cd; }
.red { background: #f8d7da; }

</style>
</head>

<body>

<h2>貸出部品検索</h2>

<div class="search-box">
<label>部品№ / 規格</label>
<input type="text" id="keyword" onkeydown="if(event.key==='Enter') searchParts();">
</div>

<div class="search-box">
<label>保管部署</label>
<input type="text" id="location" onkeydown="if(event.key==='Enter') searchParts();">
</div>

<button onclick="searchParts()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    let spec = c[2] || '';
    if (c.length > 7) {
      spec = c.slice(2, c.length - 5).join(',');
    }

    return {
      code: (c[0] || '').trim(),
      name: (c[1] || '').trim(),
      spec: spec.replace(/"/g,'').trim(),
      cereal: (c[c.length - 5] || '').trim(),
      loc: (c[c.length - 4] || '').trim(),
      borrowDate: (c[c.length - 3] || '').trim(),
      borrowNo: (c[c.length - 2] || '').trim(),
      borrowName: (c[c.length - 1] || '').trim()
    };

  });

});

/* 日付差計算 */
function daysBetween(dateStr) {
  if (!dateStr) return 0;

  const today = new Date();
  const past = new Date(dateStr);

  const diff = (today - past) / (1000 * 60 * 60 * 24);
  return Math.floor(diff);
}

/* 検索 */
function searchParts() {

  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();
  const result = document.getElementById('result');

  result.innerHTML = '';

  data
    .filter(d => {

      const keyMatch =
        !key ||
        d.code.includes(key) ||
        d.spec.toLowerCase().includes(key);

      const locMatch =
        !loc ||
        d.loc.includes(loc);

      return keyMatch && locMatch;

    })
    .sort((a, b) => {
      if (a.borrowName && !b.borrowName) return -1;
      if (!a.borrowName && b.borrowName) return 1;
      return 0;
    })
    .forEach(d => {

      const card = document.createElement('div');
      card.className = 'card';

      const days = daysBetween(d.borrowDate);

      // ✅ 色判定
      if (days >= 90) {
        card.classList.add('red');
      } else if (days >= 30) {
        card.classList.add('yellow');
      }

      card.innerHTML = `
        <div><strong>${d.code}　${d.name}</strong></div>
        <div>規格：${d.spec}</div>
        ${d.cereal ? `<div>シリアル：${d.cereal}</div>` : ''}
        <div>保管部署：${d.loc}</div>

        ${d.borrowName ? `<div class="borrow">貸出中：${d.borrowName}</div>` : ''}
        ${d.borrowDate ? `<div class="borrow">貸出日：${d.borrowDate}（${days}日）</div>` : ''}

        ${d.borrowName ? `<div><input type="checkbox"> 返却確認</div>` : ''}
      `;

      result.appendChild(card);

    });

}

</script>

</body>
</html>
