<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品管理表</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

/* 入力系 */
input, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

/* 検索ボタン（既存に合わせる） */
button {
  background: linear-gradient(#5b86e5, #4a6fcf);
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 20px;
}

/* 結果カード */
.card {
  border-top: 1px solid #ccc;
  padding: 10px 0;
}

/* スマホ調整 */
@media (max-width: 600px) {
  input, select {
    font-size: 14px;
  }
  button {
    width: 100%;
  }
}
</style>
</head>

<body>

<h1>貸出部品管理表</h1>

<!-- 保管部署 -->
<select id="office">
  <option value="">すべて</option>
</select>

<!-- 検索 -->
<input id="keyword" placeholder="部品№ / 品名 / 規格">

<button onclick="search()">検索</button>

<!-- 件数 -->
<div id="count"></div>

<!-- 結果 -->
<div id="result"></div>

<hr>

<h2>規格から保管部署検索</h2>

<input id="spec" placeholder="規格入力">

<div id="specResult"></div>

<script>
let data = [];

// ✅ CSV読み込み（カンマ対応版）
fetch("Loan Parts Tracking List.csv")
.then(res => res.text())
.then(text => {

  const rows = text.split(/\r?\n/).slice(1);

  data = rows.map(row => {
    const cols = row.match(/(".*?"|[^",\r\n]+)(?=,|\r?\n|$)/g);

    if (!cols) return null;

    return {
      部品№: cols[0] || "",
      品名: cols[1] || "",
      規格: cols[2] || "",
      保管部署: cols[5] || ""
    };
  }).filter(x => x !== null);

  initOffice();
});

// ✅ 保管部署リスト
function initOffice() {
  const sel = document.getElementById("office");
  const list = [...new Set(data.map(d => d.保管部署))];

  list.forEach(o => {
    const op = document.createElement("option");
    op.value = o;
    op.text = o;
    sel.appendChild(op);
  });
}

// ✅ 検索
function search() {

  const key = document.getElementById("keyword").value.toLowerCase();
  const office = document.getElementById("office").value;

  const result = data.filter(d => {
    return (
      (office === "" || d.保管部署 === office) &&
      (
        d.部品№.includes(key) ||
        d.品名.toLowerCase().includes(key) ||
        d.規格.toLowerCase().includes(key)
      )
    );
  });

  render(result);
}

// ✅ 表示
function render(list) {
  const div = document.getElementById("result");
  const count = document.getElementById("count");

  if (list.length === 0) {
    div.innerHTML = "該当なし";
    count.innerHTML = "0 件";
    return;
  }

  div.innerHTML = "";
  count.innerHTML = list.length + " 件";

  list.forEach(d => {

    const el = document.createElement("div");
    el.className = "card";

    el.innerHTML = `
      <b>${d.部品№}</b> ${d.品名}<br>
      規格：${d.規格}<br>
      保管部署：${d.保管部署}
    `;

    div.appendChild(el);
  });
}

// ✅ 規格 → 保管部署
document.getElementById("spec").addEventListener("input", function() {

  const val = this.value.toLowerCase();
  const set = new Set();

  data.forEach(d => {
    if (d.規格.toLowerCase().includes(val)) {
      set.add(d.保管部署);
    }
  });

  document.getElementById("specResult").innerText =
    set.size ? "該当部署： " + [...set].join(" / ") : "該当なし";
});
</script>

</body>
</html>
