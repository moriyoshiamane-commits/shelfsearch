<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貸出部品検索</title>

<style>

/* ✅ PC中央寄せ完全禁止 */
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
  max-width: none;   /* ←ここ重要 */
}

h2 {
  margin-bottom: 12px;
  font-size: 22px;
}

.search-box {
  margin-bottom: 12px;
}

label {
  display: block;
  margin-bottom: 4px;
}

input[type="text"] {
  width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 16px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 10px 0;
}

.card div {
  margin: 4px 0;
}

/* 色分け */
.yellow { background: #fff3cd; }
.red { background: #f8d7da; }

.borrow {
  color: red;
  font-weight: bold;
}

</style>
</head>

<body>

<h2>貸出部品検索</h2>

<div class="search-box">
<label>部品№ / 規格</label>
<input type="text" id="keyword" onkeydown="if(event.key==='Enter') searchParts();">
</div>

<div class="search-box">
<label>保管部署</label>
<input type="text" id="location">
</div>

<button onclick="searchParts()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

/* ===== CSV読み込み（完全安定版） ===== */
fetch('LoanParts.csv')
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    // ✅ 後ろから固定取得（ここが重要）
    const borrowName = (c.pop() || '').trim();   // 貸出先
    const borrowNo   = (c.pop() || '').trim();   // 貸出先№
    const borrowDate = (c.pop() || '').trim();   // 貸出日
    const loc        = (c.pop() || '').trim();   // 保管部署
    const cereal     = (c.pop() || '').trim();   // シリアル

    // ✅ 残りが規格（カンマOK）
    const spec = c.slice(2).join(',').replace(/"/g,'');

    return {
      code: (c[0] || '').trim(),
      name: (c[1] || '').trim(),
      spec: spec.trim(),
      cereal,
      loc,
      borrowDate,
      borrowNo,
      borrowName
    };

  });

});

/* 日数計算 */
function daysBetween(dateStr) {
  if (!dateStr) return 0;

  const today = new Date();
  const past = new Date(dateStr);

  return Math.floor((today - past) / (1000 * 60 * 60 * 24));
}

/* 検索 */
function searchParts() {

  const key = document.getElementById('keyword').value.trim().toLowerCase();
  const loc = document.getElementById('location').value.trim();
  const result = document.getElementById('result');

  result.innerHTML = '';

  data
    .filter(d => {

      const keyMatch =
        !key ||
        d.code.includes(key) ||
        d.spec.toLowerCase().includes(key);

      const locMatch =
        !loc ||
        d.loc.includes(loc);

      return keyMatch && locMatch;

    })
    .sort((a, b) => {
      // ✅ 貸出中優先
      if (a.borrowName && !b.borrowName) return -1;
      if (!a.borrowName && b.borrowName) return 1;
      return 0;
    })
    .forEach(d => {

      const card = document.createElement('div');
      card.className = 'card';

      const days = daysBetween(d.borrowDate);

      // ✅ 色分け
      if (days >= 90) card.classList.add('red');
      else if (days >= 30) card.classList.add('yellow');

      card.innerHTML = `
        <div><strong>${d.code}　${d.name}</strong></div>
        <div>規格：${d.spec}</div>
        ${d.cereal ? `<div>シリアル：${d.cereal}</div>` : ''}
        <div>保管部署：${d.loc}</div>

        ${d.borrowName ? `<div class="borrow">貸出中：${d.borrowName}</div>` : ''}
        ${d.borrowDate ? `<div class="borrow">貸出日：${d.borrowDate}（${days}日）</div>` : ''}

        ${d.borrowName ? `<div><input type="checkbox"> 返却確認</div>` : ''}
      `;

      result.appendChild(card);

    });

}

</script>

</body>
</html>
