<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>貸出部品管理表</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

/* 入力 */
input, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

/* ボタン（既存と統一） */
button {
  background: linear-gradient(#5b86e5, #4a6fcf);
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  font-size: 16px;
}

/* 結果カード */
.card {
  border-top: 1px solid #ccc;
  padding: 10px 0;
}

/* スマホ */
@media (max-width: 600px) {
  button {
    width: 100%;
  }
}
</style>
</head>

<body>

<h1>貸出部品管理表</h1>

<!-- 保管部署 -->
<select id="office">
  <option value="">すべて</option>
</select>

<!-- キーワード -->
<input id="keyword" placeholder="部品№ / 品名 / 規格">

<button onclick="search()">検索</button>

<div id="count"></div>
<div id="result"></div>

<hr>

<h2>規格から保管部署検索</h2>

<input id="spec">
<div id="specResult"></div>

<script>
let data = [];

// ✅ CSV読込（完全対策版）
fetch("Loan Parts Tracking List.csv")
.then(res => res.text())
.then(text => {

  // ① 空行除去
  const rows = text.split(/\r?\n/).filter(r => r.trim() !== "");

  // ② ヘッダー削除
  rows.shift();

  data = rows.map(row => {

    // ③ カンマ対応分割
    const cols = row.match(/(".*?"|[^",\r\n]+)(?=,|\r?\n|$)/g);

    // ④ 不正データ除去
    if (!cols || cols.length < 6) return null;

    return {
      部品№: cols[0].replace(/"/g, ""),
      品名: cols[1].replace(/"/g, ""),
      規格: cols[2].replace(/"/g, ""),
      保管部署: cols[5].replace(/"/g, "")
    };

  }).filter(d => d !== null);

  console.log("読込件数:", data.length);

  initOffice();
});

// ✅ 保管部署セット
function initOffice() {
  const sel = document.getElementById("office");
  const list = [...new Set(data.map(d => d.保管部署))];

  list.forEach(o => {
    const op = document.createElement("option");
    op.value = o;
    op.text = o;
    sel.appendChild(op);
  });
}

// ✅ 検索
function search() {
  const key = document.getElementById("keyword").value.toLowerCase();
  const office = document.getElementById("office").value;

  const result = data.filter(d => {
    return (
      (office === "" || d.保管部署 === office) &&
      (
        d.部品№.includes(key) ||
        d.品名.toLowerCase().includes(key) ||
        d.規格.toLowerCase().includes(key)
      )
    );
  });

  render(result);
}

// ✅ 表示
function render(list) {
  const div = document.getElementById("result");
  const count = document.getElementById("count");

  if (list.length === 0) {
    div.innerHTML = "該当なし";
    count.innerHTML = "0 件";
    return;
  }

  div.innerHTML = "";
  count.innerHTML = list.length + " 件";

  list.forEach(d => {

    const el = document.createElement("div");
    el.className = "card";

    el.innerHTML = `
      <b>${d.部品№}</b> ${d.品名}<br>
      規格：${d.規格}<br>
      保管部署：${d.保管部署}
    `;

    div.appendChild(el);
  });
}

// ✅ 規格検索
document.getElementById("spec").addEventListener("input", function() {

  const val = this.value.toLowerCase();
  const set = new Set();

  data.forEach(d => {
    if (d.規格.toLowerCase().includes(val)) {
      set.add(d.保管部署);
    }
  });

  document.getElementById("specResult").innerText =
    set.size ? "該当部署： " + [...set].join(" / ") : "該当なし";
});
</script>

</body>
</html>
