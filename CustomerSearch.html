<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客先検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
}

h2 {
  margin-bottom: 12px;
}

.search-box {
  margin-bottom: 10px;
  max-width: 420px;
}

label {
  display: block;
  margin-bottom: 3px;
}

input {
  width: 400px;
  max-width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.result {
  margin-top: 15px;
}

.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}
</style>

</head>

<body>

<h2>客先検索</h2>

<div class="search-box">
<label>客先名（部分一致）</label>
<input id="name" placeholder="例：東芝機械 富山">
</div>

<div class="search-box">
<label>電話番号（部分一致）</label>
<input id="tel" placeholder="例：076492">
</div>

<button onclick="search()">検索</button>

<div id="result" class="result"></div>

<script>

let data = [];

const version = "2026-05";

/* ✅ CSV読み込み（現状CSVに完全一致） */
fetch('Customer.csv?v=' + version)
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    /* ✅ CSVの右から取得（重要） */
    const addr  = (c.pop() || '').trim();  // 住所
    const zip   = (c.pop() || '').trim();  // 郵便
    const area  = (c.pop() || '').trim();  // 地区
    const fax   = (c.pop() || '').trim();  // FAX
    const tel   = (c.pop() || '').trim();  // TEL
    const name  = (c.pop() || '').trim();  // 会社名
    const no    = (c.pop() || '').trim();  // 客先No

    return {
      no,
      name,
      tel,
      fax,
      area,
      addr,
      zip
    };

  });

});


/* ✅ AND検索 */
function matchWords(text, input) {

  if (!input) return true;

  const words = input.trim().replace(/\u3000/g, ' ').split(' ').filter(w => w);

  return words.every(w => text.includes(w));
}


/* ✅ 検索 */
function search() {

  const name = document.getElementById('name').value;
  const tel = document.getElementById('tel').value;

  const result = document.getElementById('result');
  result.innerHTML = '';

  data.filter(d => {

    return matchWords(d.name, name) &&

           matchWords(
             d.tel.replace(/-/g, ''),
             tel.replace(/-/g, '')
           );

  }).forEach(d => {

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div><strong>客先№：${d.no}</strong></div>
      <div>${d.name}</div>

      <div>
        住所：
        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.addr)}" target="_
        </a>
      </div>

      <div>電話：${d.tel}</div>
      <div>地区：${d.area}</div>
    `;

    result.appendChild(card);

  });

}

</script>

</body>
</html>
