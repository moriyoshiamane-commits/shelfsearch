<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客先検索</title>
<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
}
h2 {
  margin-bottom: 12px;
}
.search-box {
  margin-bottom: 10px;
}
label {
  display: block;
  margin-bottom: 3px;
}
input {
  display: block;
  width: 400px;
  max-width: 100%;
  height: 36px;
  font-size: 16px;
}
button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}
.result {
  margin-top: 15px;
}
.card {
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}
</style>
</head>

<body>
<h2>客先検索</h2>

<div class="search-box">
  <label>客先名</label>
  <input id="name" placeholder="例:スター精機 大阪">
</div>

<div class="search-box">
  <label>TEL (ハイフン無・部分一致)</label>
  <input id="tel">
</div>

<div class="search-box">
  <label>FAX (ハイフン無・部分一致)</label>
  <input id="fax">
</div>

<div class="search-box">
  <label>エリア</label>
  <input id="area" placeholder="例:奈良">
</div>

<button onclick="search()">検索</button>

<div id="result" class="result"></div>

<script>
let data = [];
const version = "2026-05";

/* CSV読み込み（変更なし） */
fetch('CustomerMaster.csv?v=' + version)
.then(res => res.text())
.then(text => {
  const lines = text.split('\n').slice(1);

  data = lines.map(line => {
    const c = line.split(',');

    const addr = (c.pop() || '').trim();
    const zip  = (c.pop() || '').trim();
    const area = (c.pop() || '').trim();
    const fax  = (c.pop() || '').trim();
    const tel  = (c.pop() || '').trim();
    const name = (c.pop() || '').trim();
    const no   = (c.pop() || '').trim();

    return { no, name, tel, fax, area, addr, zip };
  });
});

/* ★ここだけ変更（全角・半角対応） */
function splitMatch(text, input) {
  if (!input) return true;

  // 全角→半角などを統一
  const normText = text.normalize('NFKC');
  const normInput = input.normalize('NFKC');

  const words = normInput.replace(/\u3000/g, ' ').split(' ').filter(w => w);

  return words.every(w => normText.includes(w));
}

/* 検索 */
function search() {
  const name = document.getElementById('name').value;
  const tel  = document.getElementById('tel').value;
  const fax  = document.getElementById('fax').value;
  const area = document.getElementById('area').value;
  const result = document.getElementById('result');

  result.innerHTML = '';

  data.filter(d => {
    return (
      (!name || splitMatch(d.name, name)) &&
      (!tel || d.tel.replace(/-/g, '').includes(tel.replace(/-/g, ''))) &&
      (!fax || d.fax.replace(/-/g, '').includes(fax.replace(/-/g, ''))) &&
      (!area || d.area.includes(area))
    );
  }).forEach(d => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div>顧客No: ${d.no}</div>
      <div>${d.name}</div>
      <div>〒${d.zip}</div>
      <div>${d.addr}</div>
      <div>TEL: ${d.tel}</div>
      <div>FAX: ${d.fax}</div>
      <div>エリア: ${d.area}</div>
    `;
    result.appendChild(card);
  });
}
</script>

</body>
</html>
