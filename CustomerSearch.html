<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客先検索</title>

<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.search-box { margin-bottom: 8px; }
input { width: 250px; height: 30px; }
button { padding: 8px 15px; }
.card { margin-top: 10px; border-bottom: 1px solid #ccc; padding: 8px; }
</style>

</head>
<body>

<h2>客先検索</h2>

<div class="search-box">
客先名<br>
<input id="name">
</div>

<div class="search-box">
TEL（ハイフン無・部分一致）<br>
<input id="tel">
</div>

<div class="search-box">
FAX（ハイフン無・部分一致）<br>
<input id="fax">
</div>

<div class="search-box">
地区<br>
<input id="area" placeholder="例：奈良">
</div>

<button onclick="search()">検索</button>

<div id="result"></div>

<script>

let data = [];
const version = "2026-05";

/* ✅ CSV読み込み（順序変更なし） */
fetch('Customer.csv?v=' + version)
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    /* ✅ CSVの右から取得（現状そのまま） */
    const addr  = (c.pop() || '').trim();  // 住所
    const zip   = (c.pop() || '').trim();  // 郵便
    const area  = (c.pop() || '').trim();  // 地区
    const fax   = (c.pop() || '').trim();  // FAX
    const tel   = (c.pop() || '').trim();  // TEL
    const name  = (c.pop() || '').trim();  // 会社名
    const no    = (c.pop() || '').trim();  // 客先No

    return { no, name, tel, fax, area, addr, zip };

  });

});


/* ✅ 検索（元のロジックそのまま） */
function search() {

  const name = document.getElementById('name').value;
  const tel = document.getElementById('tel').value;
  const fax = document.getElementById('fax').value;
  const area = document.getElementById('area').value;

  const result = document.getElementById('result');
  result.innerHTML = '';

  data.filter(d => {

    return (!name || d.name.includes(name)) &&

           (!tel || d.tel.replace(/-/g, '').includes(tel.replace(/-/g, ''))) &&

           (!fax || d.fax.replace(/-/g, '').includes(fax.replace(/-/g, ''))) &&

           (!area || d.area.includes(area));

  }).forEach(d => {

    const card = document.createElement('div');
    card.className = 'card';

    /* ✅ ここだけ追加（郵便番号＋住所） */
    card.innerHTML = `
      <div>客先№：${d.no}</div>
      <div>${d.name}</div>

      <div>
        〒${d.zip}<br>
        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.addr)}" target="_blank    </a>
      </div>

      <div>TEL：${d.tel}</div>
      <div>FAX：${d.fax}</div>
      <div>地区：${d.area}</div>
    `;

    result.appendChild(card);
  });
}

</script>

</body>
</html>
