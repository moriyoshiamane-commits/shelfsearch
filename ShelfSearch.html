<h2>棚番検索</h2>

<!-- ✅ ここだけ変更（凡例追加） -->
部品№（先頭の0は不要）：<br>
<input id="part" class="search-input"><br>

規格：<br>
<input id="spec" class="search-input"><br>

<button class="search-button" onclick="search()">検索</button>

<div id="result"></div>

<script>

let data = [];

const version = "2026-05";

/* ✅ 元のまま（絶対に変更しない） */
fetch('Shelf.csv?v=' + version)
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    const partNo = (c[0] || '').trim();
    const name   = (c[1] || '').trim();
    const spec   = (c[2] || '').trim();
    const shelf  = (c[3] || '').trim();

    return { partNo, name, spec, shelf };

  });

});


/* ✅ 元のまま */
function search() {

  const partNoInput = document.getElementById('part').value;
  const specInput   = document.getElementById('spec').value;

  const result = document.getElementById('result');
  result.innerHTML = '';

  data.filter(d => {

    return (!partNoInput || d.partNo.includes(partNoInput)) &&
           (!specInput || d.spec.includes(specInput));

  }).forEach(d => {

    const card = document.createElement('div');

    card.innerHTML = `
      <div>部品№：${d.partNo}</div>
      <div>${d.name}</div>
      <div>規格：${d.spec}</div>
      <div>棚番：${d.shelf}</div>
    `;

    result.appendChild(card);

  });

}

</script>
``
