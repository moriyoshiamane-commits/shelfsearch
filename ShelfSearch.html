<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棚番検索</title>

<style>
body {
  font-family: sans-serif;
  font-size: 16px;
  margin: 10px;
}

.search-box {
  margin-bottom: 10px;
}

label {
  display: block;
  margin-bottom: 3px;
}

input {
  display: block;
  width: 300px;
  max-width: 100%;
  height: 36px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  color: #fff;
  background: linear-gradient(#5b8de3,#3f6ac7);
  border: none;
  border-radius: 6px;
}

.card {
  margin-top: 10px;
  border-bottom: 1px dotted #ccc;
  padding: 8px 0;
}

.note {
  font-size: 13px;
  color: #666;
  margin-bottom: 10px;
}
</style>

</head>

<body>

<h2>棚番検索</h2>

<div class="search-box">
<label>部品№</label>
<input id="partNo" placeholder="例：10709">
</div>

<!-- ✅ 必ずここに置く（安全エリア） -->
<div class="note">
※先頭の0は省略して入力できます（例：010709 → 10709）
</div>

<div class="search-box">
<label>規格（部分一致）</label>
<input id="spec">
</div>

<button onclick="search()">検索</button>

<div id="result"></div>

<script>

let data = [];

const version = "2026-05";

/* ✅ ここは元通り */
fetch('Shelf.csv?v=' + version)
.then(res => res.text())
.then(text => {

  const lines = text.split('\n').slice(1);

  data = lines.map(line => {

    const c = line.split(',');

    const partNo = (c[0] || '').trim();
    const name   = (c[1] || '').trim();
    const spec   = (c[2] || '').trim();
    const shelf  = (c[3] || '').trim();

    return { partNo, name, spec, shelf };

  });

});


function search() {

  const partNoInput = document.getElementById('partNo').value;
  const specInput   = document.getElementById('spec').value;

  const result = document.getElementById('result');
  result.innerHTML = '';

  data.filter(d => {

    return (!partNoInput || 
            d.partNo.padStart(6, '0').includes(partNoInput.padStart(6, '0'))) &&
           (!specInput || d.spec.includes(specInput));

  }).forEach(d => {

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div>部品№：${d.partNo}</div>
      <div>${d.name}</div>
      <div>規格：${d.spec}</div>
      <div>棚番：${d.shelf}</div>
    `;

    result.appendChild(card);

  });

}

</script>

</body>
</html>
