<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務アシスタント</title>

<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

.menu-button {
  display: inline-block;
  padding: 10px 16px;
  margin-top: 10px;
  margin-right: 8px;
  background: linear-gradient(#5b8de3, #3f6ac7);
  color: #ffffff;
  font-weight: bold;
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  border: none;
  cursor: pointer;
}

.delete-button {
  margin-top: 8px;
  padding: 6px 10px;
  background: #d9534f;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

textarea {
  width: 100%;
  max-width: 500px;
}

.card {
  border:1px solid #ccc;
  margin:10px 0;
  padding:10px;
}
</style>

</head>

<body>

<h2>業務アシスタント</h2>

<textarea id="mailtext" rows="10" placeholder="ここにメール内容を貼り付け"></textarea>
<br>

<button class="menu-button" onclick="parseMail()">登録</button>
<button class="menu-button" onclick="exportJSON()">データ出力</button>
<button class="menu-button" onclick="display('today')">本日の予定</button>
<button class="menu-button" onclick="display('future')">今後の予定</button>
<button class="menu-button" onclick="display('past')">過去</button>

<h3>登録済み</h3>
<div id="list"></div>

<script>
let data = [];

// ✅ ページ読み込み
window.onload = function(){
  fetch("visit_data.json")
    .then(res => res.json())
    .then(json => {
      data = json;

      display('future');

      // ✅ ✅ 本日の予定チェック（ここが新機能）
      showTodayReminder();
    });
};

// ✅ ✅ 本日のリマインド
function showTodayReminder(){
  let today = new Date();
  today.setHours(0,0,0,0);

  let todayList = data.filter(d => {
    if(!d.date) return false;

    let dDate = new Date(d.date);
    dDate.setHours(0,0,0,0);

    return dDate.toDateString() === today.toDateString();
  });

  if(todayList.length > 0){
    let msg = "本日の来客があります\n\n";

    todayList.forEach(d => {
      msg += `・${d.customer}\n`;
      msg += `　${d.rawDate}\n`;
      msg += `　${d.room || ""}\n\n`;
    });

    alert(msg);
  }
}

// ✅ 登録
function parseMail(){
  let text = document.getElementById("mailtext").value;

  let dateText = (text.match(/訪問日時：(.+)/) || ["",""])[1];
  let customer = (text.match(/お客様　：(.+)/) || ["",""])[1];
  let trader = (text.match(/商社様　：(.+)/) || ["",""])[1];
  let staff = (text.match(/営業担当：(.+)/) || ["",""])[1];
  let room = (text.match(/打合せ室：(.+)/) || ["",""])[1];

  let dateMatch = dateText.match(/(\d{4})\/(\d{2})\/(\d{2})/);
  let dateObj = dateMatch ? `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` : null;

  data.push({
    rawDate: dateText,
    date: dateObj,
    customer: customer,
    trader: trader,
    staff: staff,
    room: room
  });

  display('future');
  document.getElementById("mailtext").value = "";
}

// ✅ 削除
function deleteRecord(index){
  if(confirm("削除しますか？")){
    data.splice(index, 1);
    display('future');
  }
}

// ✅ 表示
function display(mode){
  let today = new Date();
  today.setHours(0,0,0,0);

  let filtered = data.filter(d => {
    if(!d.date) return false;

    let dDate = new Date(d.date);
    dDate.setHours(0,0,0,0);

    if(mode === 'today'){
      return dDate.toDateString() === today.toDateString();
    }

    if(mode === 'future'){
      return dDate >= today;
    }

    if(mode === 'past'){
      return dDate < today;
    }

    return true;
  });

  filtered.sort((a,b) => new Date(a.date) - new Date(b.date));

  let html = "";

  filtered.forEach(d => {
    let index = data.indexOf(d);

    html += `
      <div class="card">
        <b>${d.rawDate}</b><br>
        ${d.customer}<br>
        商社様：${d.trader || ""}<br>
        担当：${d.staff}<br>
        打合せ室：${d.room || ""}<br>
        <button class="delete-button" onclick="deleteRecord(${index})">削除</button>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

// ✅ JSON表示
function exportJSON(){
  let dataStr = JSON.stringify(data, null, 2);

  let win = window.open("", "_blank");
  win.document.write("<pre>" + dataStr + "</pre>");
}
</script>

</body>
</html>
