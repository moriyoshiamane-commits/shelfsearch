<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工場見学予定入力</title>

<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

.menu-button {
  display: inline-block;
  padding: 10px 16px;
  margin-top: 10px;
  margin-right: 8px;
  background: linear-gradient(#5b8de3, #3f6ac7);
  color: #ffffff;
  font-weight: bold;
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  border: none;
  cursor: pointer;
}

.delete-button {
  margin-top: 8px;
  padding: 6px 10px;
  background: #d9534f;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

textarea {
  width: 100%;
  max-width: 500px;
}

.card {
  border:1px solid #ccc;
  margin:10px 0;
  padding:10px;
}
</style>

</head>

<body>

<h2>工場見学予定 入力</h2>

<textarea id="mailtext" rows="10" placeholder="ここにメール内容を貼り付け"></textarea>
<br>

<button class="menu-button" onclick="parseMail()">登録</button>
<button class="menu-button" onclick="exportJSON()">データ出力</button>
<button class="menu-button" onclick="display(true)">本日の予定</button>
<button class="menu-button" onclick="display()">全予定</button>

<h3>登録済み</h3>
<div id="list"></div>

<script>
let data = [];

// ✅ 共有データ読み込み
window.onload = function(){
  fetch("visit_data.json")
    .then(res => res.json())
    .then(json => {
      data = json;
      display();
    })
    .catch(() => {
      let saved = localStorage.getItem("visitData");
      if(saved){
        data = JSON.parse(saved);
      }
      display();
    });
};

// ✅ 登録
function parseMail(){
  let text = document.getElementById("mailtext").value;

  let dateText = (text.match(/訪問日時：(.+)/) || ["",""])[1];
  let customer = (text.match(/お客様　：(.+)/) || ["",""])[1];
  let staff = (text.match(/営業担当：(.+)/) || ["",""])[1];
  let room = (text.match(/打合せ室：(.+)/) || ["",""])[1];  // ★追加

  let dateMatch = dateText.match(/(\d{4})\/(\d{2})\/(\d{2})/);
  let dateObj = dateMatch ? `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` : null;

  let record = {
    rawDate: dateText,
    date: dateObj,
    customer: customer,
    staff: staff,
    room: room  // ★追加
  };

  data.push(record);

  localStorage.setItem("visitData", JSON.stringify(data));

  display();

  document.getElementById("mailtext").value = "";
}

// ✅ 削除
function deleteRecord(index){
  if(confirm("削除しますか？")){
    data.splice(index, 1);
    localStorage.setItem("visitData", JSON.stringify(data));
    display();
  }
}

// ✅ 表示
function display(showToday=false){
  let today = new Date();
  today.setHours(0,0,0,0);

  let filtered = data.filter(d => {
    if(!d.date) return false;

    let dDate = new Date(d.date);
    dDate.setHours(0,0,0,0);

    if(showToday){
      return dDate.toDateString() === today.toDateString();
    }

    return dDate >= today;
  });

  filtered.sort((a,b) => new Date(a.date) - new Date(b.date));

  let html = "";

  filtered.forEach((d, index) => {
    html += `
      <div class="card">
        <b>${d.rawDate}</b><br>
        ${d.customer}<br>
        担当：${d.staff}<br>
        打合せ室：${d.room || ""}<br> <!-- ★追加 -->
        <button class="delete-button" onclick="deleteRecord(${index})">削除</button>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

// ✅ データ出力
function exportJSON(){
  let dataStr = JSON.stringify(data, null, 2);

  let blob = new Blob([dataStr], {type: "application/json"});
  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "visit_data.json";
  a.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
