<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>工場見学予定入力</title>
</head>
<body>

<h2>工場見学予定 入力</h2>

<textarea id="mailtext" rows="15" cols="60"
placeholder="ここにメール内容を貼り付け"></textarea>

<br><br>
<button onclick="parseMail()">登録</button>

<h3>登録済み</h3>
<div id="list"></div>

<script>
let data = [];

function parseMail(){
  let text = document.getElementById("mailtext").value;

  let date = (text.match(/訪問日時：(.+)/) || ["",""])[1];
  let customer = (text.match(/お客様　：(.+)/) || ["",""])[1];
  let staff = (text.match(/営業担当：(.+)/) || ["",""])[1];

  let record = {
    date: date,
    customer: customer,
    staff: staff
  };

  data.push(record);
  display();

  document.getElementById("mailtext").value = "";
}

function display(){
  let html = "";

  data.forEach(d => {
    html += `
    <div style="border:1px solid #ccc; margin:10px; padding:10px;">
      <b>${d.date}</b><br>
      ${d.customer}<br>
      担当：${d.staff}
    </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}
</script>

</body>
</html>
``
