<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工場見学予定入力</title>

<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

/* 共通ボタン */
.menu-button {
  display: inline-block;
  padding: 10px 16px;
  margin-top: 10px;
  margin-right: 8px;
  background: linear-gradient(#5b8de3, #3f6ac7);
  color: #ffffff;
  font-weight: bold;
  text-decoration: none;
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  border: none;
  cursor: pointer;
}

/* 入力欄 */
textarea {
  width: 100%;
  max-width: 500px;
}

/* カード */
.card {
  border:1px solid #ccc;
  margin:10px 0;
  padding:10px;
}
</style>

</head>

<body>

<h2>工場見学予定 入力</h2>

<textarea id="mailtext" rows="10" placeholder="ここにメール内容を貼り付け"></textarea>
<br>

<button class="menu-button" onclick="parseMail()">登録</button>
<button class="menu-button" onclick="display(true)">本日の予定</button>
<button class="menu-button" onclick="display()">全予定</button>

<h3>登録済み</h3>
<div id="list"></div>

<script>
let data = [];

// ✅ 初期読み込み（保存データ復元）
window.onload = function(){
  let saved = localStorage.getItem("visitData");
  if(saved){
    data = JSON.parse(saved);
  }
  display();
};

// ✅ 登録
function parseMail(){
  let text = document.getElementById("mailtext").value;

  let dateText = (text.match(/訪問日時：(.+)/) || ["",""])[1];
  let customer = (text.match(/お客様　：(.+)/) || ["",""])[1];
  let staff = (text.match(/営業担当：(.+)/) || ["",""])[1];

  // 日付変換
  let dateMatch = dateText.match(/(\d{4})\/(\d{2})\/(\d{2})/);
  let dateObj = dateMatch ? `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` : null;

  let record = {
    rawDate: dateText,
    date: dateObj,
    customer: customer,
    staff: staff
  };

  data.push(record);

  // ✅ 保存
  localStorage.setItem("visitData", JSON.stringify(data));

  display();

  document.getElementById("mailtext").value = "";
}

// ✅ 表示
function display(showToday=false){
  let today = new Date();
  today.setHours(0,0,0,0);

  let filtered = data.filter(d => {
    if(!d.date) return false;

    let dDate = new Date(d.date);

    if(showToday){
      return dDate.getTime() === today.getTime();
    }

    return dDate >= today;
  });

  // ✅ 日付順
  filtered.sort((a,b) => new Date(a.date) - new Date(b.date));

  let html = "";

  filtered.forEach(d => {
    html += `
      <div class="card">
        <b>${d.rawDate}</b><br>
        ${d.customer}<br>
        担当：${d.staff}
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}
</script>

</body>
</html>
